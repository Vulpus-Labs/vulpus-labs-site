<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-container">
    <header class="site-header">
      {{ partial "header.html" . }}
    </header>

    <div class="content-wrapper">
      {{ block "main" . }}{{ end }}
    </div>

    <footer class="site-footer">
      {{ partial "footer.html" . }}
    </footer>
  </div>
</body>
</html>
