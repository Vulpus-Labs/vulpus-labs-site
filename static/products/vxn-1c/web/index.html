<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vxn-1c: web demo</title>
  <!-- Link previews (Open Graph, X): the faceplate. Crawlers want absolute
       URLs, so these name the published page, where `cargo xtask deploy-web` puts it.
       The page itself is built by silkscreen-page.mjs (0326). -->
  <meta name="description" content="Play vxn-1c, the dual-layer virtual analogue synth from Vulpus Labs, in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vulpus Labs">
  <meta property="og:title" content="vxn-1c: web demo">
  <meta property="og:description" content="Play vxn-1c, the dual-layer virtual analogue synth from Vulpus Labs, in your browser.">
  <meta property="og:url" content="https://vulpuslabs.com/products/vxn-1c/web/">
  <meta property="og:image" content="https://vulpuslabs.com/products/vxn-1c/web/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="663">
  <meta property="og:image:alt" content="The vxn-1c faceplate">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://vulpuslabs.com/products/vxn-1c/web/og-image.png">
</head>
<body>
  <script type="module">
    import * as wasm from "./pkg/vxn1c_web.js";
    import { mountSynthPage } from "./silkscreen-page.mjs";

    mountSynthPage({
      wasm,
      name: "vxn-1c",
      blurb: "the dual-layer virtual analogue synth",
      engine: "./vxn1c_web_engine.wasm",
      example: "vxn1c",
    });
  </script>
</body>
</html>
