<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VXN-1b</title>
<style>
/* Faceplate scaffold — VXN1b compact 3-row layout (0209, ADR 0001 §7).
   940×556 logical (EDITOR_WIDTH / EDITOR_HEIGHT in lib.rs), 10px outer
   padding, 8px vertical gap between banner / preset-bar / tab strip / rows,
   6px horizontal gap between panels in a row. Panel heights are derived to fit
   the layer pane's 3 rows inside the window (see `--panel-h`). CSS vars are named
   after the vxn-ui Rust constants so the mapping stays obvious; pixel
   literals stay out of selectors so a future resize policy is one
   variable change. */
:root {
  /* Palette (matches vxn-ui-vizia's STYLE block). */
  --face-bg: #2b2b2b;
  --panel-bg: #1c1c1c;
  --panel-bg-hi: #2f2f2f;        /* subtle top-left highlight for the panel gradient */
  --panel-border: #0e0e0e;
  --panel-corner: 4px;
  --header-bg: #a7cfe2;
  --header-fg: #141414;
  --banner-fg: #a7cfe2;
  --text: #d6d6d6;
  --ctl-label: #aeaeae;
  --ctl-value: #d9701b;          /* orange readout — Vizia .ctl-value */
  --track-bg: #0e0e0e;
  --track-fill: #d9701b;
  /* Fader fill (the lit portion below/behind the knob): a fixed pale→bright
     blue gradient the knob travels over, revealing more of it as it rises. */
  --fader-fill-pale: #35507e;
  --fader-fill-bright: #6cb1ff;
  /* "Lit toggle" — the shared on-state for every small square switch: the tab
     switches, the panel-header switches, the toggle-grid rows and the preset
     bar's active button. Four blocks hardcoded these same three hexes before
     0319, so a palette change meant finding all four. */
  --lit-bg: #1f9cff;
  --lit-border: #84cdff;
  --lit-glow: #36b3ff;
  --thumb-bg: #87afb2;
  --thumb-border: #a7cfe2;       /* matches --glyph-active / --knob-indicator */
  --glyph: #888888;
  --glyph-active: #a7cfe2;
  --knob-face: #2a2a2a;
  --knob-rim: #444444;
  --knob-dimple: #222222;
  --knob-dimple-rim: #333333;
  --knob-indicator: #a7cfe2;       /* matches --glyph-active */

  /* Geometry. The window is sized to the LAYER pane: banner (26) +
     preset-bar (30) + tab strip (26) + 3×8 chrome vgaps + 2×10 padding, over
     three rows of 144 + 144 + 184 with 2×8 pane gaps. Rows 1–2 are 144px; the
     bottom row (Voice / Scope) is taller (--panel-h-3) so Voice's Legato
     toggle and Mod Matrix button clear the denser content instead of
     overlapping it. See EDITOR_HEIGHT, which must match the RENDERED figure,
     not the sum — the banner and tab strip carry 1 px borders outside their
     declared heights.

     Widths and travels were opened out in the 0282 geometry pass; the rows
     are sized so the under-fader toggles (Cutoff's Tuned, the LFO Syncs) clear
     the panel floor at `--fader-h` 76, and the top row's panels come to 902 px
     of the 1060 width. Neither has much give. */
  --editor-w: 1060px;
  --pad-outer: 10px;
  --banner-h: 26px;
  --preset-bar-h: 30px;
  --panel-h: 144px;           /* PANEL_H — rows 1–2 */
  --panel-h-3: 184px;         /* PANEL_H_3 — bottom row, taller for denser panels */
  /* FX/Global rows. The LAYER pane dictates the window, and the FX pane's
     content is shorter — before 0282 that showed as a 45–65 px dead band under
     every panel in row 1 and a 42 px one under three of the four FX panels.
     The two rows now split the pane's full height between them and scale their
     own controls into it (`.row-global-1` / `.row-global-2` re-declare
     `--fader-h` / `--col-h` locally), so the space goes into travel on the
     master and FX faders rather than into empty panel. */
  --panel-h-global-1: 240px;
  --panel-h-global-2: 240px;
  --col-h: 110px;             /* COL_H — per-control column inside a panel */
  --fader-h: 76px;            /* FADER_H — fader travel */
  /* Channel strip (the mixer's two, and the scope's): the meter and the level
     fader span BOTH dial rows beside them, so their height is the dial
     column's, not `--fader-h`. Two dial cells of (label 12 + 1 margin + 1 gap
     + 36 knob) plus the 4 px column gap = 104. Rows may re-declare it — the
     FX pane's mixer runs a taller strip and centres the dials in it. */
  --strip-h: 104px;
  --panel-pad: 5px;
  --panel-vgap: 4px;
  --row-vgap: 8px;
  --row-hgap: 6px;
  --header-h: 16px;
  --header-toggle-slot: 16px; /* reserves the Chorus/Delay header switch (0045) */
  /* Toggle box, and so the height of a `.ctl-tg-row` — the label beside it is
     9px type in an 11px line box. Named because the Voice panel's Width grid
     reserves a row of exactly this height. */
  --tg-box: 11px;
  --ctl-label-h: 12px;
  --ctl-gap: 2px;
  /* Vertical fader geometry — the SMALL scale, used by every fader in the
     LAYER pane. The FX rows run a LARGE one, declared further down on
     `.row-global-1, .row-global-2`: the 0282 travels differ by nearly 2x
     between the panes, and a track sized for a 76 px fader reads as a hairline
     under a 136 px one. */
  --fader-track-w: 4px;
  --thumb-w: 18px;
  --thumb-h: 6px;
  /* The horizontal bipolar fader keeps its own cap. It rides a 4 px track a
     fraction of any vertical fader's travel, so it stays at the small scale
     even where the row around it is large. */
  --h-thumb-w: 6px;
  --h-thumb-h: 18px;
  --wave-knob-size: 64px;     /* matches the prototype's "Compact" variant */
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--face-bg);
  color: var(--text);
  font-family: "IBM Plex Sans Condensed", -apple-system, system-ui, sans-serif;
  /* Disable text selection across the faceplate — knobs / faders behave more
     like physical controls than text. */
  user-select: none;
  -webkit-user-select: none;
}

.faceplate {
  width: var(--editor-w);
  box-sizing: border-box;
  padding: var(--pad-outer);
  display: flex;
  flex-direction: column;
  gap: var(--row-vgap);
}

.banner {
  height: var(--banner-h);
  background: linear-gradient(to top left, var(--panel-bg), var(--panel-bg-hi));
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-corner);
  color: var(--banner-fg);
  font-size: 16px;
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Preset bar (0049). Sits in the 30px row between banner and Row 1.
   Carries the current preset name, prev/next walker buttons over the
   combined Factory+User list, a Browse toggle (binds to 0050's browser
   panel), and a Save As button (opens the 0048 floating popup). The
   status chip is the same `.status-pill` primitive 0046 introduced —
   re-anchored from the lower-right corner to the right of the name
   (ticket §Notes). */
.preset-bar-slot {
  height: var(--preset-bar-h);
  background: linear-gradient(to top left, var(--panel-bg), var(--panel-bg-hi));
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-corner);
  display: flex;
  align-items: center;
  padding: 0 8px;
  gap: 6px;
  box-sizing: border-box;
  color: var(--text);
}
.pbar-btn {
  /* Palette vars so a theme tweak is one edit. */
  background: var(--knob-face);
  border: 1px solid var(--knob-rim);
  border-radius: 2px;
  color: var(--ctl-label);
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 8px;
  height: 18px;
  cursor: pointer;
  user-select: none;
}
.pbar-btn:hover { border-color: var(--glyph-active); color: #ececec; }
.pbar-btn:disabled,
.pbar-btn:disabled:hover {
  opacity: 0.4;
  cursor: default;
  border-color: var(--knob-rim);
  color: var(--ctl-label);
}
.pbar-btn.active {
  /* Same lit fill as the switches, deliberately without their glow: this is a
     text button, not a lamp. */
  background: var(--lit-bg);
  border-color: var(--lit-border);
  color: #fff;
}
.pbar-step { padding: 0 6px; min-width: 18px; text-align: center; }
.pbar-name {
  font-size: 12px;
  color: var(--ctl-value);
  font-weight: 600;
  letter-spacing: 0.5px;
  min-width: 150px;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pbar-spacer { flex: 1 1 auto; }

/* `.faceplate` is the positioned anchor for body-level popups. The preset
   browser panel markup + CSS now live in the shared crate
   (vxn_core_ui_web::PRESET_BROWSER_CSS, appended to this sheet at splice). */
.faceplate { position: relative; }

/* Three-tab shell (0219, ADR 0002 §8). The tab strip sits between the preset
   bar and the panes; only the active pane displays. Layer 1 / Layer 2 share the
   layer pane (the surface rebinds to the edit layer); FX / Global is its own
   pane. */
.tab-strip {
  height: var(--banner-h);
  display: flex;
  gap: var(--row-hgap);
  flex: 0 0 auto;
}
.tab-btn {
  position: relative;          /* anchor the Layer 2 switch at the left edge */
  flex: 1 1 0;
  background: linear-gradient(to top left, var(--panel-bg), var(--panel-bg-hi));
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-corner);
  color: var(--ctl-label);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  background: var(--header-bg);
  color: var(--header-fg);
  border-color: var(--header-bg);
}

/* Panes stack their rows; only `.active` shows. The faceplate flex column's
   `gap` already spaces the strip from the pane, so the pane just carries its
   own inter-row gap. */
.tab-pane { display: none; }
.tab-pane.active {
  display: flex;
  flex-direction: column;
  gap: var(--row-vgap);
}

.row {
  display: flex;
  gap: var(--row-hgap);
  height: var(--panel-h);
}


.panel {
  position: relative;             /* anchor for absolutely-placed .panel-strip */
  /* Subtle diagonal wash — the grey lifts slightly toward the top-left. */
  background: linear-gradient(to top left, var(--panel-bg), var(--panel-bg-hi));
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-corner);
  padding: var(--panel-pad);
  display: flex;
  flex-direction: column;
  gap: var(--panel-vgap);
  min-width: 0;
  flex: 1 1 0;
  box-sizing: border-box;
}

/* Per-row stretch shares (compact 3-row layout, ADR 0001 §7). flex-basis
   is 0 so `flex-grow` gives a pure ratio.
   Row 1 — Osc 1 · Osc 2 · Mixer · Filter.
   Row 2 — LFO 1 · LFO 2 · Env 1 · Env 2.
   Row 3 — Voice · FX · Master. */
.row-1 .panel[data-name="Osc 1"]  { flex-grow: 1.2; }
.row-1 .panel[data-name="Osc 2"]  { flex-grow: 1.2; }
.row-1 .panel[data-name="Mixer"]  { flex-grow: 1.0; }
.row-1 .panel[data-name="Filter"] { flex-grow: 1.8; }   /* densest — Mode group + 5 faders (Key added, 0245) */

.row-2 .panel[data-name="LFO 1"] { flex-grow: 1.2; }
.row-2 .panel[data-name="LFO 2"] { flex-grow: 0.7; }
.row-2 .panel[data-name="Env 1"] { flex-grow: 0.9; }
.row-2 .panel[data-name="Env 2"] { flex-grow: 0.9; }

/* Layer pane's bottom row — Voice · Scope. Voice is sized to its natural width
   and the scope takes literally everything left over: a waveform is the one
   thing here that reads better the wider it is, while a column of toggles gains
   nothing from the extra pixels — a share of the row it cannot fill just shows
   as dead panel to the right of Cross Mod.
   This is the one row that opts out of the pure-ratio scheme above. Voice's
   width is the sum of its columns, which changed twice (Cross Mod folding in,
   then 0284's Phase + Distrib) and each time left the tuned ratio either
   squeezing the labels together or trailing ~58px of nothing. `flex: 0 1 auto`
   takes the number out of the stylesheet: the panel asks for what its columns
   need and still shrinks first if the row ever runs short. */
.row-layer-3 { height: var(--panel-h-3); }
.row-layer-3 .panel[data-name="Voice"] { flex: 0 1 auto; }
.row-layer-3 .panel[data-name="Scope"] { flex-grow: 1.0; }

/* Hairline rule between two groups of columns inside one panel body — Voice's
   allocation columns and the cross-mod pair. Full body height, so it reads as a
   divider rather than as a very thin control. */
.panel-sep {
  flex: 0 0 1px;
  align-self: stretch;
  /* `--panel-border` and `--track-bg` are both near-black: right against the
     face, invisible against `--panel-bg` (#1c1c1c). The knob rim is the
     faceplate's existing "structural line drawn ON a panel" tone. */
  background: var(--knob-rim);
  margin: 0 6px;
}

/* Layer 2 enable switch, carried on the Layer 2 tab button (0219 §4) the way FX
   tabs carry their own on/off. Off (default) → Layer 2 bypassed; on → live.
   Clicking it also selects the Layer 2 tab (the click bubbles to the button). */
/* Same embedded square toggle as the FX/Dynamics header-switch
   (`.panel-header-switch`): grey off, blue-lit on. Pinned to the left edge of
   the tab with the label centred, matching the Dynamics header layout. */
.tab-switch {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  background: #4a4a4a;
  border: 1px solid #2c4a59;
  border-radius: 2px;
  box-sizing: border-box;
  cursor: pointer;
}
.tab-switch:hover { border-color: #141414; }
.tab-switch.on {
  background: var(--lit-bg);
  border-color: var(--lit-border);
  box-shadow: 0 0 6px var(--lit-glow);
}

/* Mod-matrix modal + rows — ported from vxn-2 (style.css .overlay-* / .vxn-mm-*),
   adapted to vxn-1b's palette. A dismissible modal over the whole faceplate. */
.overlay-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.overlay-backdrop[hidden] { display: none; }
.overlay-panel {
  background: var(--panel-bg);
  border: 1px solid var(--ctl-value);
  border-radius: var(--panel-corner);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  padding: 12px;
  max-width: 900px;
  max-height: 90%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.overlay-title {
  color: var(--banner-fg);
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
}
.overlay-close {
  position: absolute;
  top: 6px;
  right: 10px;
  background: transparent;
  border: none;
  color: var(--ctl-label);
  font-size: 18px;
  cursor: pointer;
}
.overlay-close:hover { color: var(--text); }

/* Confirmation modal — reuses the overlay chrome for a title / message / two
   buttons. Narrow: it asks one question, and a dialogue as wide as the matrix
   editor would read as a panel rather than a prompt. The destructive action is
   tinted and sits on the right, with Cancel to its left as the resting choice
   (backdrop click and Esc both land on Cancel). */
.confirm-panel { max-width: 340px; }
.confirm-message {
  font-size: 11px;
  line-height: 1.4;
  color: var(--text);
}
.confirm-actions {
  display: flex;
  flex-direction: row;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 4px;
}
.pbar-btn.confirm-ok {
  background: #7a2f14;
  border-color: var(--ctl-value);
  color: #f0d5c4;
}
.pbar-btn.confirm-ok:hover { background: #a33f1b; color: #fff; }

.mm-overlay { min-width: 720px; }
.mm-overlay-list {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* Row grid: # | source | dest | amount | curve | scale | bin. */
.vxn-mm-header,
.vxn-mm-row {
  display: grid;
  grid-template-columns: 24px 1fr 1fr 130px 88px 1fr 24px;
  gap: 6px;
  align-items: center;
  padding: 3px 0;
  min-height: 26px;
}
.vxn-mm-header {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ctl-label);
  position: sticky;
  top: 0;
  background: var(--panel-bg);
}
.vxn-mm-row { color: #6f7780; }
.vxn-mm-row[data-active="1"] { color: var(--text); }
.vxn-mm-slot-num { text-align: right; font-variant-numeric: tabular-nums; font-size: 10px; }
.vxn-mm-scale { min-width: 0; }

/* Bipolar fader (ported from vxn-2 .vxn-mm-depth): a compact centre-origin
   HORIZONTAL fader. The centre tick marks 0; the fill grows signed left/right
   from it (makeBipolar drives left/width).

   Keyed on the primitive's OWN class names rather than on the matrix overlay
   that first used it. Scoped to `.vxn-mm-depth`, a second consumer inherited
   none of it: a track with no height or background is an invisible control,
   and an invisible control with no box is also an unclickable one. (That
   consumer was the mixer's layer-detune slider (0263), since made a dial — the
   overlay is the only user again, but the rules stay keyed on the primitive so
   the next one does not repeat the lesson.) Only the width cap below is really
   the overlay's, and it stays there. */
.vxn-mm-depth {
  position: relative;         /* anchor for the value-pop */
  min-width: 0;
  justify-self: stretch;
  width: 100%;
}
.fader-track {
  position: relative;
  width: 100%;
  height: 4px;
  margin: 0 auto;
  background: var(--track-bg);
  border-radius: 2px;
}
/* The matrix row is wide; a full-width depth track there would dwarf the combos
   beside it. Panels that want the whole width (the mixer strip) just don't have
   this cap. */
.vxn-mm-depth .fader-track { max-width: 120px; }
.fader-track-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 0;
  background: var(--track-fill);
}
.fader-thumb {
  position: absolute;
  width: var(--h-thumb-w);
  height: var(--h-thumb-h);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--thumb-bg);
  border: 1px solid var(--thumb-border);
  border-radius: 2px;
  cursor: ew-resize;
}
.vxn-mm-depth-center {
  position: absolute;
  top: -3px;
  bottom: -3px;
  left: 50%;
  width: 1px;
  background: var(--glyph);
  transform: translateX(-50%);
  pointer-events: none;
}

/* Custom dropdown (matrix.js buildCombo) — replaces the native <select> so no
   NSMenu steals webview first-responder (the macOS/WKWebView first-click bug).
   The popup is body-attached + fixed so the modal's overflow can't clip it. */
.vxn-mm-combo {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  box-sizing: border-box;
  background: #0e0e0e;
  border: 1px solid #333;
  border-radius: 2px;
  color: var(--text);
  font: inherit;
  font-size: 11px;
  padding: 2px 4px;
  height: 20px;
  cursor: pointer;
  outline: none;
}
.vxn-mm-combo:hover,
.vxn-mm-combo:focus,
.vxn-mm-combo.open { border-color: var(--glyph-active); }
.vxn-mm-combo-label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.vxn-mm-combo-caret { flex: 0 0 auto; color: var(--ctl-label); font-size: 8px; }
.vxn-mm-combo-pop {
  position: fixed;
  z-index: 500;
  max-height: 60vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: #141414;
  border: 1px solid var(--glyph-active);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
  padding: 2px;
  font-size: 11px;
}
.vxn-mm-combo-opt {
  padding: 3px 8px;
  color: var(--text);
  white-space: nowrap;
  cursor: pointer;
  border-radius: 2px;
}
.vxn-mm-combo-opt:hover { background: #2a2a2a; }
.vxn-mm-combo-opt.sel { color: var(--ctl-value); }
.vxn-mm-bin {
  background: transparent;
  border: 1px solid #2c3038;
  border-radius: 3px;
  color: var(--ctl-label);
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  padding: 2px 4px;
}
.vxn-mm-bin:hover { color: var(--text); border-color: #4a5060; }

.panel-header {
  height: var(--header-h);
  background: var(--header-bg);
  color: var(--header-fg);
  border-radius: 2px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-transform: uppercase;
}

.panel[data-header-toggle] .panel-header {
  justify-content: flex-start;
  padding-left: 3px;
  gap: 4px;
}
.panel[data-header-toggle] .panel-header-toggle-slot {
  width: var(--header-toggle-slot);
  height: var(--header-toggle-slot);
  flex: 0 0 var(--header-toggle-slot);
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel[data-header-toggle] .panel-header-title {
  flex: 1 1 auto;
  text-align: center;
  margin-right: var(--header-toggle-slot);
}

.panel-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: 4px;
  align-items: stretch;
  justify-content: space-evenly;
}
/* Panels whose first body child is a selector buttongroup anchor it to the
   panel's left edge so the distance from panel padding → first button is
   uniform across the panels that lead with one — Filter and Reverb (Cross Mod
   folded into Voice in 0282). Subsequent faders flow with a fixed gap rather
   than the body's default `space-evenly`.
   Voice gets the same treatment by name: its body now leads with the Poly/Solo
   rocker rather than the Width group, and the anchoring belongs to the panel's
   layout either way. Stating it here (rather than matching a first-child
   `.ctl-col`) also keeps it off `.ctl-col-center` — a fader with its toggle
   beneath is an ordinary fader column and wants the body's `space-evenly`. */
.panel-body:has(> .ctl-buttongroup:first-child),
.panel[data-name="Voice"] .panel-body {
  justify-content: flex-start;
  gap: 10px;
}
/* Left-anchored buttongroup left-aligns its own contents too so the box
   edge sits at `--panel-pad` regardless of label / row widths — keeps the
   distance from panel border to first selector uniform across panels. Voice's
   Width group is second in its body but wants the same treatment: its two
   columns of checkboxes read as a block, and centring the WIDTH label over
   them would leave it off every box beneath it. */
.panel-body > .ctl-buttongroup:first-child,
.panel[data-name="Voice"] .panel-body > .ctl-buttongroup {
  align-items: flex-start;
}

/* ── Control primitives (0041) ──────────────────────────────────────────── */

/* Common cell — a vertical stack of label, control, value. */
.ctl {
  position: relative;          /* anchor for the absolute .ctl-value popup */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: var(--ctl-gap);
  height: var(--col-h);
  min-width: 0;
}

.ctl-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--ctl-label);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  height: var(--ctl-label-h);
  line-height: var(--ctl-label-h);
  margin-bottom: 4px;
  /* One line, always. The height above is a single line's worth, so a label
     that wraps does not make room for its second line — it paints over the
     control underneath ("CROSS MOD" over the Off variant). Column widths come
     out of the labels' max-content size, which fits every one of them exactly
     and leaves no slack, so whether a two-word label wraps comes down to the
     renderer's font metrics: the same markup that sits on one line in Chrome
     wrapped in the plugin's web view. `nowrap` settles it in the layout instead
     of in the font — the column simply asks for the width the text needs. */
  white-space: nowrap;
}

/* `.value-pop` moved to the shared `vxn-core-ui-web/assets/value-pop.css`
   (0140); appended to this faceplate's `<style>` at splice time. */

/* Status pill (0046) — inline chip in the preset bar, right of the
   current name (0049 §Notes). Driven by the controller's `Status { line }`
   ViewEvent (clamp warnings on preset load, save / load messages). Fades
   after ~3s; pure CSS animation so the JS side just sets the line and
   toggles the `visible` class. */
.status-pill {
  background: var(--track-bg);
  border: 1px solid var(--glyph-active);
  border-radius: 3px;
  padding: 2px 8px;
  font-size: 10px;
  color: #f6f6f6;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 240ms ease-out;
}
.status-pill.visible { opacity: 1; }

/* Fader — vertical track + thumb. Pointer ops issue Begin/EndGesture
   brackets so the host's automation lane records as one event, not a
   pixel storm. */
.ctl-fader {
  position: relative;
  width: var(--thumb-w);
  height: var(--fader-h);
  cursor: ns-resize;
  /* Hit area extends slightly past the track so a near-miss still grabs. */
  touch-action: none;
}
.ctl-fader-track {
  position: absolute;
  left: calc((var(--thumb-w) - var(--fader-track-w)) / 2);
  top: 0;
  width: var(--fader-track-w);
  height: 100%;
  /* Dark backdrop; the lit fill is painted by ::after on top. */
  background: var(--track-bg);
  border-radius: 2px;
}
/* Midpoint marker — layered between the dark backdrop (below) and the lit
   fill (above, ::after), so a fill risen past the midpoint covers it. */
.ctl-fader-track::before {
  content: '';
  position: absolute;
  left: -3px;
  right: -3px;
  top: 50%;
  transform: translateY(-50%);
  height: 3px;
  background: #3a3a3a;
  z-index: 1;
}
/* Lit fill — a fixed-height pale→bright-blue gradient over the whole track
   (pale at the bottom, bright near the top), revealed from the bottom up to
   the knob via clip. `--fader-norm` (0..1) is set by setThumb on the cell. */
.ctl-fader-track::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--fader-fill-pale), var(--fader-fill-bright));
  clip-path: inset(calc((1 - var(--fader-norm, 0)) * 100%) 0 0 0);
  border-radius: 2px;
  z-index: 2;
}
.ctl-fader-thumb {
  position: absolute;
  left: 0;
  width: var(--thumb-w);
  height: var(--thumb-h);
  box-sizing: border-box;
  background: var(--thumb-bg);
  border: 2px solid var(--thumb-border);
  border-radius: 1px;
  transform: translateY(-50%);
  top: 50%;
  pointer-events: none;
  /* Above the track backdrop, midpoint marker (z1) and lit fill (z2). */
  z-index: 3;
  /* Drop-shadow so the knob sits proud of the track, plus the faint rim glow. */
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.55), 0 0 4px rgba(255, 255, 255, 0.15);
}
.ctl-fader.dragging .ctl-fader-thumb {
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.55), 0 0 6px var(--ctl-value);
}

/* Rotary waveform selector. SVG-based: knob face + rotating
   indicator + glyph labels arranged at the corners (SW/NW/NE/SE) outside
   the rim. All visuals + hit-testing live in the SVG; no DOM children to
   reflow. Layout stability comes for free — the dial occupies a fixed
   square (--wave-knob-size) regardless of state. */
.ctl-wave {
  width: var(--wave-knob-size);
  height: var(--wave-knob-size);
  cursor: grab;
  touch-action: none;
}
.ctl-wave.dragging { cursor: grabbing; }

/* Rotary dial (0208). Ported from vxn-2's `.dial`; a compact 36px SVG knob —
   270° arc track + fill + circular face + rotating indicator line — used in
   the Dynamics pane so six params fit a narrow 2-row grid instead of six
   vertical faders. Palette reuses the shared knob/track/fader-fill vars so it
   matches the wave knob and faders rather than vxn-2's hardcoded hexes. */
.ctl-dial {
  display: block;
  cursor: ns-resize;
  touch-action: none;
  /* The lit arc's halo has to paint OUTSIDE this box. An `<svg>` clips to its
     viewport by default, and the geometry leaves no room: the arc sits at
     r=15 with a 2px stroke, so its outer edge is 16 from the centre of an
     18-radius box — 2px of headroom for a drop-shadow whose outer blur is 4px.
     Clipped, the bloom stops dead on a hard square just outside the ring, which
     reads as a lit panel rather than a lit lamp. Chrome shows it plainly; the
     plugin's WebKit does the same thing more faintly. */
  overflow: visible;
}
.ctl-dial .dial-track {
  fill: none;
  stroke: var(--track-bg);
  stroke-width: 2;
  stroke-linecap: round;
}
.ctl-dial .dial-fill {
  fill: none;
  stroke: var(--fader-fill-bright);
  stroke-width: 2;
  stroke-linecap: round;
  /* The lit perimeter reads as a lamp, not a painted arc — a soft bloom in its
     own colour, tight enough not to wash the dial face behind it. Two stacked
     drop-shadows: a bright close one and a wider, fainter halo. */
  filter: drop-shadow(0 0 1.5px var(--fader-fill-bright))
          drop-shadow(0 0 4px rgba(122, 190, 255, 0.45));
}
.ctl-dial .dial-face {
  fill: var(--knob-face);
  stroke: var(--knob-rim);
  stroke-width: 0.5;
}
.ctl-dial .dial-indicator-line {
  stroke: var(--knob-indicator);
  stroke-width: 1.5;
  stroke-linecap: round;
}
/* Dragging burns the arc out to white, halo included. */
.ctl-dial.dragging .dial-fill {
  stroke: #fff;
  filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(180, 220, 255, 0.55));
}
.ctl-dial.dragging .dial-indicator-line { stroke: #fff; }

/* Dynamics pane: six dials in a 3×2 grid on the left + the Mix fader
   beside them. Kept narrow — the dials are 36px, so the whole panel reads
   compact next to the taller vertical-fader panels. The dial cells carry no
   `.ctl` column-flex; the grid owns their placement. */
.dynamics-body {
  flex-direction: row;
  /* Dial grid, Mix fader and the meter cluster read as three groups, so space
     them evenly rather than letting flex strand them at the panel edges. */
  justify-content: space-evenly;
  align-items: flex-start;
  gap: 8px;
}
.dial-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, auto);
  /* Column gap is set by the LABELS, not the knobs: THRESH / MKUP run wider
     than the 48 px dial under them, so a 6 px gap left the labels nearly
     touching while the knobs looked strung together. */
  gap: 4px 18px;
  align-items: center;
  justify-items: center;
}
.dial-grid > .ctl {
  height: auto;                /* override the full-column .ctl height */
  flex: 0 0 auto;
  min-width: 0;
  gap: 1px;
}
/* Mix fader beside the dial grid keeps the normal full-height column. */
.dynamics-body > .ctl[data-control="fader"] { flex: 0 0 auto; }

/* Bottom strip — selector/toggle controls (NoiseColor, FilterSlope, etc.)
   relocated into the panel's free clearance below the main column row.
   Absolutely placed so it never grows the panel or competes with ctl
   columns for flex space. Mirrors the vizia editor's strip placement
   (left: 8px, bottom: 4px). */
.panel-strip {
  position: absolute;
  left: 8px;
  /* `--panel-pad`, not a hair less: it puts the strip's bottom edge exactly on
     the panel body's, so a strip toggle and an under-fader toggle
     (`.ctl-col-center`) in the same panel sit on one line. */
  bottom: var(--panel-pad);
  right: 5px;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  pointer-events: none;           /* empty space passes through to body */
}
.panel-strip > * { pointer-events: auto; }

/* Cross-layer cells (0217): the LFO 2 Link toggle only means anything on the
   slave layer, so hide it while the pane shows Layer 1. `visibility` (not
   `display`) so the strip's other cells never shift on a tab flip. */
[data-edit-layer="upper"] [data-layer2-only] { visibility: hidden; }

/* Link is hand-wired (KeyState, not a param), so it never gets the inline-flex
   `makeSwitch` sets on the cells it builds. Left as a block, its toggle sits in
   a line box whose leading lifts the row a few pixels — enough to miss the line
   it shares with LFO 2's Sync. */
#lfo2-link {
  display: inline-flex;
  align-items: center;
}

/* The Voice panel's strip carries the Mod Matrix button alone. Pushed to the
   right end so it sits under Cross Mod — the far side of the panel's dividing
   rule from the voice-allocation columns, which is the group it does not
   belong to either way, but the end the eye leaves the panel from. */
.panel[data-name="Voice"] .panel-strip { justify-content: flex-end; }

/* Oversample and Limit share one line: the strip is wide enough for both, and
   stacked they cost the panel a second row for a single toggle. Limit is
   pushed to the far right so it reads as its own control rather than as a
   fourth oversample option. */
.master-strip {
  justify-content: space-between;
}
/* `space-between` alone parks Limit on the strip's right edge, a little past
   the meter above it. Pulled back so the box + label centre on the out meter's
   bars — the toggle then reads as belonging to that column. */
.master-strip [data-param="limiter_on"] { margin-right: 18px; }

/* ── Level meters (0240) ───────────────────────────────────────────────────
   A meter mount is NOT a param cell: it carries no `data-control` /
   `data-param`, so `rebindAllForLayer` never touches it and it holds no model
   state. The `.ctl-meter` wrapper reuses the standard column stack so a meter
   lines up with the faders beside it.

   Bars fill bottom-up from a `height` on `.meter-fill`; the peak marker is a
   1px rule positioned by `bottom`. Both are set as percentages by
   `panels/meter.js`, so the geometry here only has to establish the track.
   `.ctl-meter` / `.meter-mount` themselves are set under "Meter / fader
   alignment" below, where the label-offset rationale lives. */
.meter-bar {
  position: relative;
  width: 5px;
  height: 100%;
  background: var(--track-bg);
  border-radius: 1px;
  overflow: hidden;
}

/* Green working range → amber approaching full scale → red at the top. The
   gradient is fixed to the TRACK, not the fill, so a given colour always means
   the same level — the fill just reveals more of it as it rises (same trick as
   the faders' blue gradient). */
.meter-fill {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 0;
  background-image: linear-gradient(
    to top,
    #2f7d46 0%,
    #4fbf6a 62%,       /* ≈ −22 dBFS on the −60…0 scale */
    #d9b21b 83%,       /* ≈ −10 dBFS */
    #d94b1b 100%
  );
  background-size: 100% var(--fader-h);
  background-repeat: no-repeat;
  background-position: bottom;
}

.meter-peak {
  position: absolute;
  left: 0;
  width: 100%;
  height: 1px;
  background: #e8e8e8;
  pointer-events: none;
}

/* Clip latches the bar's frame red until the peak marker decays back under
   the threshold — a transient overload stays visible after the bar has fallen. */
.meter-bar.clipped { box-shadow: inset 0 0 0 1px #ff4a2b; }

/* Gain reduction (0241) reads DOWNWARD from 0 dB — the standard compressor
   idiom — so its fill anchors to the top of the track instead of the bottom. */
.meter-gr .meter-fill {
  top: 0;
  bottom: auto;
  background-image: linear-gradient(to bottom, #d9701b 0%, #d94b1b 100%);
  background-position: top;
}

/* ── Layer scope ───────────────────────────────────────────────────────────
   Like a meter mount, the scope is not a param cell — no `data-control` /
   `data-param`, no model state, mounted from `[data-scope]`. The canvas has no
   intrinsic size: it fills the mount, and `panels/scope.js` re-measures the box
   on every draw and resizes the backing store to match (the layer pane is
   `display: none` while another tab is up, where the box measures 0×0). */
/* Scope body is a row: canvas on the left taking whatever is left over, the
   edit-layer strip pinned to the right. (It was `display: block` while the
   canvas was the body's only child.) */
.panel-scope .panel-body {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  justify-content: flex-start;
  gap: 0;
}
.scope-mount {
  /* Flexes rather than claiming `width: 100%`: the scope panel body also holds
     the layer strip below, and a 100%-wide canvas beside it overflows. */
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  min-height: 0;
}

/* Layer strip beside the scope (0282). Level / pan / detune on the EDIT layer —
   the same three params the FX pane's mixer strips carry, bound a second time
   here (`model.controls` is id → [updaters], so both cells track one another
   through the engine's echo). The scope shows the edit layer's post-fader,
   post-pan output, so the controls that shape that trace are worth having in
   reach of it instead of a tab away.

   `data-layered`, not `data-fixed-layer`: this strip follows the edit layer
   exactly as the scope's tap does. The mixer's strips are the opposite — both
   layers at once — which is the whole distinction between the two surfaces. */
.scope-strip {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding-left: 10px;
}
/* Same shape as a mixer channel — a title naming the group, the level fader
   spanning the two dials beside it — so the two surfaces read as the same
   control in two places rather than as two different ones. The title is the
   label row for the fader (which is why the fader cell carries
   `data-no-label`), exactly as L1 / L2 is in the mixer.
   `.ctl-fader` carries its own `--fader-h`, so the primitive needs the
   override too. */
.scope-strip-body {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 6px;
}
.scope-strip-body > .ctl {
  height: var(--strip-h);
  gap: 0;
}
.scope-strip-body .ctl-fader {
  height: 100%;
}
.scope-canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--track-bg);
  border: 1px solid var(--panel-border);
  border-radius: 2px;
  box-sizing: border-box;
}

/* Toggle row — small box + inline label. Matches vizia .tg-row /
   .tg-box / .tg-lbl exactly (#1f9cff active fill, 9×9 box, 7 px label). */
.ctl-tg-row {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.ctl-tg-box {
  width: var(--tg-box);
  height: var(--tg-box);
  background: #4a4a4a;
  border: 1px solid #8a8a8a;
  border-radius: 2px;
  box-sizing: border-box;
}
.ctl-tg-row:hover .ctl-tg-box { border-color: #c4c4c4; }
.ctl-tg-row.active .ctl-tg-box {
  background: var(--lit-bg);
  border-color: var(--lit-border);
  box-shadow: 0 0 6px var(--lit-glow);
}
.ctl-tg-lbl {
  font-size: 9px;
  color: #9a9a9a;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 700;
}
.ctl-tg-row.active .ctl-tg-lbl { color: #ececec; }

/* ButtonGroup — rendered exactly like a strip of toggles (same `.ctl-tg-row`
   children) but inside a normal column with a label on top. Used for
   Oversample, Cross Mod type and Voice's stack width (the last of which is
   half of what VXN1 called AssignMode; 0266 split it). */
.ctl-buttongroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--ctl-gap);
}
.ctl-buttongroup .ctl-tg-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
}
/* Multi-column variant (`data-columns` on the cell). Column-major: with six
   variants in two columns the first three fill column one, so Width reads
   1/2/4 · 8/16/32 — each column a doubling run, which is how the scale is
   actually thought about. Rows are explicit (`grid-auto-flow: column` needs a
   row count to know where to break); the JS mirrors the same number into
   `--ctl-rows`. */
.ctl-buttongroup[data-columns] .ctl-tg-rows {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--ctl-rows, 3), auto);
  gap: 5px 12px;
  justify-items: start;
}
/* Row-major variant (`data-flow="row"` beside `data-columns`). Column-major is
   the default because it suits a doubling run read down a column; a group laid
   out to be read ACROSS — Width as 1 · 2 · 4 over 8 · 16 · 32 — needs the other
   flow, and then it is the column count the grid has to be told. */
.ctl-buttongroup[data-columns][data-flow="row"] .ctl-tg-rows {
  grid-auto-flow: row;
  grid-template-rows: none;
  grid-template-columns: repeat(var(--ctl-cols, 2), auto);
}

/* A stacked pair of cells sharing one column of the panel body — the Voice
   panel's Width group with its Poly/Solo rocker beneath. `.ctl` sets a fixed
   `--col-h`; this wrapper leaves its children their natural heights so the
   two sit flush. */
.ctl-col {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-width: 0;
}
.ctl-col > .ctl { height: auto; }

/* Voice's allocation stack: Width, the Poly/Solo rocker, Legato. The column is
   as wide as the Width group (its widest child), and the rocker stretches to
   that width so its two labels land over the two button columns — which is the
   whole reason it is the horizontal one. Legato keeps its natural width; a
   checkbox stretched to 60px would read as a bar, not a toggle. */
.voice-stack > .voice-mode { align-self: stretch; }
/* The rocker's natural width (two labels either side of the travel) is wider
   than the two button columns at their natural gutter, so it is the rocker that
   sets the column width — and the width group spreads to match rather than
   sitting short of it. The two button columns then land under POLY and SOLO,
   which is what makes the rocker read as spanning them instead of merely
   sitting below. */
.voice-stack > [data-param="stack_width"] { align-self: stretch; }
/* Selector matches the row-major rule's specificity and then some, ON PURPOSE:
   that rule sets `grid-template-rows: none`, and a plainer selector here loses
   to it however far down the file it sits. Do not simplify. */
.voice-stack > [data-param="stack_width"][data-flow="row"] .ctl-tg-rows {
  align-self: stretch;
  justify-content: space-between;
  /* Three explicit rows for two rows of buttons. The third is deliberately
     empty: the six widths used to run 3×2 and the rocker and Legato sat under
     that, so reserving the row they vacated keeps both where the eye already
     expects them instead of sliding the group up into the gap. An empty
     template row, not padding — it is a row's worth of space, and saying so in
     the grid means the gap above it comes for free. */
  grid-template-rows: repeat(3, var(--tg-box));
}

/* Centred variant — a toggle parked directly beneath the fader it modifies
   (LFO Rate ↔ Sync, Cutoff ↔ Tuned), centred on the fader rather than
   left-aligned like the Voice stack. The budget is tight: a fader cell is
   label 12 + 4 + gap 2 + travel 56 = 74, the toggle row is ~13, and
   `panel-body` is 94 tall, so the gap has to stay at 4 for the pair to clear
   the panel's bottom padding. */
.ctl-col-center {
  align-items: center;
  gap: 4px;
}
/* Row 2 is the LFOs, and both of them pair an under-fader Sync with something
   in the bottom strip (LFO 1's Free, LFO 2's Link). `space-between` drops the
   toggle to the body's bottom edge — where `.panel-strip` now bottoms out too —
   so the pair reads as one line of toggles instead of two near-misses. The
   fader itself stays flush with its neighbours at the top.
   Deliberately not global: Filter's Tuned and Delay's Sync have no strip to
   line up with, and Delay's body is 134px tall, so bottoming out there would
   strand the toggle half a panel below the fader it belongs to. */
.row-2 .ctl-col-center {
  justify-content: space-between;
}

/* Rocker — a two-state switch drawn vertically, variant 0 above the travel and
   variant 1 below it, the labels sitting either end rather than beside a box.
   Used where both states are equal-status choices (Poly vs Solo, White vs
   Pink, 12 vs 24, Lin vs Exp) rather than one being "on": a checkbox-style
   `.ctl-tg-row` per variant says "these are independent things you can each
   enable", which is exactly what a mode is not. Clicking anywhere on the
   control flips it.

   Vertical, not horizontal, so the two labels stack in the width of the
   longer one — which is what lets a rocker be a normal `panel-body` column
   (Mixer's Col, Filter's Slope, the two Env Shapes) instead of a pair of
   toggles absolutely parked in the bottom strip. Enum rockers carry a
   `.ctl-label` header, so the column's top edge lines up with the fader
   labels beside it. */
.ctl-rocker {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: var(--ctl-gap);
  cursor: pointer;
}
/* A rocker standing as its own `panel-body` column reserves the height its
   neighbours spend on a `.ctl-label`, so its top variant name lines up with
   their labels rather than floating above them. Rockers nested deeper (Voice's,
   before 0269 moved it) get no such row. */
.panel-body > .ctl-rocker {
  padding-top: calc(var(--ctl-label-h) + 4px);
}
/* Labels + travel in their own box, so the reserved label row above stays out
   of the gap between the two variant names. */
.ctl-rocker-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.ctl-rocker-lbl {
  font-size: 9px;
  color: #7a7a7a;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 700;
}
.ctl-rocker-lbl.active { color: #ececec; }
.ctl-rocker-track {
  position: relative;
  width: 12px;
  height: 26px;
  background: var(--track-bg);
  border: 1px solid #8a8a8a;
  border-radius: 6px;
  box-sizing: border-box;
  flex: 0 0 auto;
}
.ctl-rocker:hover .ctl-rocker-track { border-color: #c4c4c4; }
.ctl-rocker-knob {
  position: absolute;
  top: 1px;
  left: 1px;
  width: 8px;
  height: 8px;
  background: #b8b8b8;
  border-radius: 50%;
  transition: top 90ms ease, background 90ms ease;
}
/* `.right` is the second variant — the knob slides down to sit against its own
   label. The track deliberately does NOT light up the way `.ctl-tg-row.active`
   does: a lit control reads as "on", and neither position of a mode switch is
   on. Position is the whole signal, backed by which label is bright. */
.ctl-rocker.right .ctl-rocker-knob {
  top: 15px;
}

/* Horizontal variant (`data-orient="h"` on the cell) — the same three parts
   laid on a row, travel between the two labels. Used only by Voice's Poly/Solo,
   which sits under the Width group rather than beside it: stacked in a column
   of its own the vertical form is what keeps a rocker narrow, but *under* a
   two-column button group there is a width to fill and a horizontal travel is
   the one that reads as spanning it. Everything else keeps the vertical form.
   The knob's `.right` offset has to be re-stated: the vertical rule above still
   matches, and a `top: 15px` on a 12px-tall track drops it out of the bottom. */
.ctl-rocker[data-orient="h"] { align-items: stretch; }
.ctl-rocker[data-orient="h"] .ctl-rocker-body {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.ctl-rocker[data-orient="h"] .ctl-rocker-track {
  width: 26px;
  height: 12px;
}
.ctl-rocker[data-orient="h"] .ctl-rocker-knob {
  transition: left 90ms ease, background 90ms ease;
}
.ctl-rocker[data-orient="h"].right .ctl-rocker-knob {
  top: 1px;
  left: 15px;
}

/* Dropdown — native <select> styled to match the dark palette. Fallback for
   enums that don't fit ButtonGroup (too many variants, or a long name list). */

/* Dimmed — applied to control cells whose param is gated by a sibling
   (LFO 1's Delay/Fade dim while Free is on; Filter Slope dims when the
   mode is Notch, where the DSP's `FilterMode::mix` ignores slope, see
   vxn-dsp/src/ota_ladder.rs). Visual-only: pointer events still pass
   through so DAW automation echoes still move the thumb. Same selector
   covers both panel-body (`.ctl`) and panel-strip (`.ctl-strip`)
   mounts. */
.ctl.dimmed, .ctl-strip.dimmed { opacity: 0.4; }

/* Header-switch box (Chorus / Delay, 0045) — a small toggle child of
   `.panel-header-toggle-slot`. Sized to sit *inside* the 16 px header
   bar, not fill it, so the box reads as a control on the header rather
   than the header's whole left edge. Palette matches `.ctl-tg-box` but
   the inactive border picks up a header-tinted shade so it reads as
   part of the header chrome. */
.panel-header-switch {
  width: 10px;
  height: 10px;
  background: #4a4a4a;
  border: 1px solid #2c4a59;
  border-radius: 2px;
  box-sizing: border-box;
  cursor: pointer;
}
.panel-header-switch:hover { border-color: #141414; }
.panel-header-switch.active {
  background: var(--lit-bg);
  border-color: var(--lit-border);
  box-shadow: 0 0 6px var(--lit-glow);
}

/* ── FX/Global tab (0220 / 0241) ───────────────────────────────────────────
   Two rows:
     1. MIXER (narrow) | DYNAMICS | MASTER
     2. PHASER | CHORUS | DELAY | REVERB — one section each, on/off in header.
   The four effects were previously one tabbed panel showing a single effect at
   a time; side by side they fill the row and expose all four on/off states. */
/* Row 1 is the tallest row in the editor, and it is the mixer that sets the
   figure: two channel strips of title + meter/fader/dials + mute, with the
   split beneath them, need ~180 px of panel body. It costs nothing — the
   window is sized to the LAYER pane (428 px of rows), and even at this height
   the global pane's two rows come to 424, so the row is taking slack that was
   already there rather than growing the editor. */
/* Both FX-pane rows carry their own control scale. The pane holds less
   than the LAYER pane does, so at the shared `--fader-h` it rendered as two
   bands of empty panel; declaring the vars on the row lets the faders grow into
   the height instead. Nothing else has to know — `.ctl-fader`, the lit fill and
   `paintFader`'s thumb are all relative to the live element height. */
/* LARGE fader scale — the two FX-pane rows, whose travels (136 / 120 px) are
   nearly double the LAYER pane's. Track and thumb scale with the travel so a
   long fader does not read as a hairline; the LAYER pane keeps the small
   scale declared on `:root`. The horizontal bipolar fader opts out via its own
   `--h-thumb-*` vars, which nothing overrides here. */
.row-global-1,
.row-global-2 {
  --fader-track-w: 7px;
  --thumb-w: 24px;
  --thumb-h: 10px;
}

/* The same argument applies to the other two primitives in this row. The
   meters (mixer strips, Dynamics in/GR/out, Master out) run the row's full
   136 px beside the widened faders, and the dials (Dynamics' six, the mixer's
   pan / detune) sit in panels with width to spare — both were sized for the
   LAYER pane's tighter columns. The dial is an SVG with a viewBox, so a CSS
   box override scales the whole drawing, strokes included; nothing in
   `makeDial` has to know. */
.row-global-1 .meter-bar { width: 8px; }
.row-global-1 .ctl-dial { width: 48px; height: 48px; }

.row-global-1 {
  height: var(--panel-h-global-1);
  --fader-h: 136px;
  --col-h: 170px;
  /* The channel strip runs the row's fader travel exactly, so the mixer's
     level faders and the FX faders beside them share both ends of their
     tracks. The dial pair (two cells of label 12 + 48 knob, 4 px apart) is
     shorter than that and `.strip-dials` centres it against the difference. */
  --strip-h: var(--fader-h);
  /* Slack under a standard `.ctl` column: height 170 less (label 12 + 4
     margin + 2 gap + 136 travel). The mixer's strips and its split column are
     not `.ctl`s but have to sit on the same lines as one, so they reproduce
     the column's box with this. */
  --col-slack: 16px;
  /* Strip pitch, shared by the strips and the split column beside them. */
  --mixer-strip-gap: 28px;
}
.row-global-2 {
  height: var(--panel-h-global-2);
  --fader-h: 120px;
  --col-h: 154px;
}
/* Delay's Sync / Ping-pong sit under the faders they re-map. The 4 px of the
   LAYER pane's tight columns is not this row's budget — it read as the toggle
   hanging off the fader's bottom end. */
.row-global-2 .ctl-col-center { gap: 12px; }

/* Dynamics and Master are sized by their own content, not the mixer's, so in a
   row this tall they would sit against the header with a band of empty panel
   beneath. Centring their bodies spreads that gap to both sides, which reads as
   deliberate rather than as a layout that ran short. The mixer keeps its
   `flex-start` — it fills the row.

   Row 2 gets the same treatment for the same reason, and there it is the whole
   row bar Delay: Delay carries a Sync / Ping-pong strip under its faders and
   the other three do not, so Delay sets the row height and the rest run ~54 px
   short of it. Scaling only those three up would give one row two different
   fader lengths, which is worse than the gap. */
.row-global-1 .panel[data-name="Dynamics"] .panel-body,
.row-global-1 .panel[data-name="Master"] .panel-body,
.row-global-2 .panel-body {
  align-items: center;
}

/* The mixer is deliberately narrow — two channel strips (meter + fader + a
   column of two dials) and the split beneath them, nothing else. */
.row-global-1 .panel[data-name="Mixer"]    { flex-grow: 0; flex-basis: 330px; }
.row-global-1 .panel[data-name="Dynamics"] { flex-grow: 1.35; }
.row-global-1 .panel[data-name="Master"]   { flex-grow: 1; }

/* Five / four / three faders: let the wider sections take proportionally more
   so every fader column ends up the same width across the row. The weights
   follow `0.15 + 0.25·faders` — Phaser carries five since Stereo joined it. */
.row-global-2 .panel[data-name="Phaser"] { flex-grow: 1.4; }
.row-global-2 .panel[data-name="Chorus"] { flex-grow: 0.9; }
.row-global-2 .panel[data-name="Delay"]  { flex-grow: 0.9; }
.row-global-2 .panel[data-name="Reverb"] { flex-grow: 1.15; }

/* ── Meter / fader alignment ───────────────────────────────────────────────
   A meter must line up with the fader TRACKS beside it, not with the top of
   the control cell. Every meter cell therefore carries its label ABOVE the bar
   exactly as a fader does, so the label block supplies the offset and the bars
   land level with the tracks — no per-cell padding to keep in sync with the
   label height. The mixer strips are the exception: their shared strip title
   (LAYER 1 / LAYER 2) is the label row for both the meter and the fader, and
   neither carries one of its own, so there both simply start at the top. */
.ctl-meter { justify-content: flex-start; }

.meter-mount {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  gap: 2px;
  height: var(--fader-h);
}

/* ── Mixer ─────────────────────────────────────────────────────────────── */
/* Strips on the left, the split column on the right — the split is a keyboard
   property rather than a channel, so it reads better beside the two strips
   than stacked under them, and vertical it matches every other control in the
   row. Children stretch to the body height: both the strips and the split
   column pin a toggle to the body's bottom edge, which is the line Master's
   Oversample row sits on. */
.mixer-body {
  flex-direction: row;
  align-items: stretch;
  justify-content: center;
  gap: var(--mixer-strip-gap);
}

/* Two channel strips side by side. This is a mixer, so both layers show at
   once regardless of the edit-layer tab — the cells are `data-fixed-layer`,
   not `data-layered`. */
.mixer-strips {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  justify-content: center;
  height: 100%;
  /* The panel is wider than the two strips need, so the slack goes
     between them rather than to the panel edges — the strips read as two
     channels, not as one block pushed to the middle. */
  gap: var(--mixer-strip-gap);
}

/* A strip is not a `.ctl`, but it must land on a `.ctl`'s lines: title on the
   label row, fader track on the track row. It therefore reproduces the column
   box — label height + 4 margin + `--ctl-gap` + travel + `--col-slack` — and
   centres that box in the full-height strip, which is exactly what the body's
   `align-items: center` does to the columns in the panels beside it. The mute
   is out of flow (below) so it cannot disturb the centring. */
.mixer-strip {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--ctl-gap);
  height: 100%;
}
.mixer-strip-body { margin-bottom: var(--col-slack); }

/* Spelled out rather than abbreviated: the panel has the width for it now that
   the strip is meter + fader + dial column, and "LAYER 1" needs no decoding.
   Capitalised in the markup, like the panel headers — the control labels get
   their caps from `text-transform` on `.ctl-label`, but this is not a `.ctl`.
   `align-self: stretch` + centred text keeps it centred over the whole strip
   instead of over whatever its own text happens to measure. */
.strip-title {
  font-size: 9px;
  font-weight: 700;
  color: var(--ctl-label);
  letter-spacing: 0.6px;
  height: var(--ctl-label-h);
  line-height: var(--ctl-label-h);
  align-self: stretch;
  text-align: center;
  /* Same 4 px as `.ctl-label` — this is the label row for the strip. */
  margin-bottom: 4px;
}

/* Meter to the LEFT of its fader — channel-strip convention, and it puts the
   bar next to the control that sets it — with the pan/detune dial column to
   the right of the pair. The strip title names the layer, so neither the meter
   nor the fader carries its own label; both start at the same y, so
   `flex-start` is what keeps the meter and the fader track aligned. */
.mixer-strip-body {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 5px;
}
/* The fader cell is a full control column (label slot + travel); with the label
   suppressed it must not still reserve the column height, or the mute below it
   is pushed away from the strip. Direct child only — the dial cells inside
   `.strip-dials` size themselves (see below).

   Height is the DIAL COLUMN's, not `--fader-h`: level and its meter run the
   full height of the pan/detune pair beside them, which is the channel-strip
   read (one long fader, its meter alongside, the trim knobs stacked next to
   it) and gives the fader half again the travel it had. `.ctl-fader` carries
   its own `--fader-h`, so the primitive needs the override too — the track,
   the lit fill and `paintFader`'s thumb are all relative to the live element
   height, so nothing else has to know. */
.mixer-strip-body > .ctl {
  height: var(--strip-h);
  gap: 0;
}
.mixer-strip-body .ctl-fader {
  height: 100%;
}
.mixer-strip-body .meter-mount,
.scope-strip-body .meter-mount {
  height: var(--strip-h);
}
/* The meter's colour gradient is sized to the TRACK so a given colour always
   means the same level (see `.meter-fill`). That size is stated in pixels, so
   the taller mixer bar has to restate it or the amber/red band would sit at
   −22/−10 dB of a 56 px meter partway up a 104 px one. */
.mixer-strip-body .meter-fill,
.scope-strip-body .meter-fill {
  background-size: 100% var(--strip-h);
}

/* Pan and detune (0248, reworked from a slider to a dial): two dials stacked
   in a column beside the meter/fader pair rather than strung out beneath it.
   Both are centre-origin params, both are placement rather than level, and a
   column of two 36 px dials is shorter than the label+control rows they used
   to occupy — so the strip gets back the height the split section wanted, and
   the meter/fader pair spans the column rather than sitting short of it.

   `height: auto` is load-bearing: a `.ctl` otherwise reserves a full `--col-h`
   control column, and a 36 px dial claiming 90 px of one pushes the mute and
   the whole split section out of the panel. Nothing in the strip is a full
   column — the strip title is the label row for the meter and fader, and the
   dials carry their own one-word labels. */
.strip-dials {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  /* Take the strip's height and centre in it: the meter and the level fader
     span the full strip, which is taller than two dials, and knobs pinned to
     the top of a long fader read as though they had come loose from it. */
  height: var(--strip-h);
}
.strip-dial {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  height: auto;
}
/* DETUNE is the longest label in the panel; at the strip's width it would set
   the column wider than its dial. Trimmed a point and de-spaced so it fits the
   36 px knob. */
.strip-dial .ctl-label {
  font-size: 9px;
  letter-spacing: 0.2px;
  margin-bottom: 1px;
}

/* Mute centred under its own strip, and pinned to the strip's bottom edge —
   which, the strip being full-height, is the panel body's bottom edge, the
   line Master's Oversample row and the split enable also sit on. Out of flow
   so the strip's flow content can centre on the `.ctl` lines above it. */
.mixer-mute {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
}

/* Split is a column at the mixer's right edge, built on the same box as a
   strip: the note readout takes the label row, the (vertical) point slider the
   track row, and the enable toggle is pinned to the body's bottom edge beside
   the mutes. */
.mixer-split {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--ctl-gap);
  height: 100%;
}

/* `column-reverse`: the markup is slider-then-readout (the readout is the
   slider's value), but the readout is what occupies the label row, so it
   draws above. */
.split-point-row {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: var(--ctl-gap);
  margin-bottom: var(--col-slack);
}

/* Vertical, and the same travel as the faders it lines up with. Two idioms
   because two engines: `writing-mode` + `direction: rtl` is the modern one
   (min at the bottom); `slider-vertical` is the legacy WebKit appearance, kept
   for older WKWebViews and ignored where the first pair works. */
.split-point-slider {
  flex: 0 0 auto;
  width: 20px;
  height: var(--strip-h);
  writing-mode: vertical-lr;
  direction: rtl;
  -webkit-appearance: slider-vertical;
  /* The UA sheet gives a range input a 2 px margin; left in, it makes this
     column 4 px taller than a `.ctl` and the readout sits a couple of pixels
     above the label row it shares. */
  margin: 0;
  accent-color: var(--track-fill);
}

.split-point-readout {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 700;
  color: var(--ctl-value);
  font-variant-numeric: tabular-nums;
  height: var(--ctl-label-h);
  line-height: var(--ctl-label-h);
  /* Same 4 px as `.ctl-label`; this is the label row for the column. */
  margin-bottom: 4px;
  text-align: center;
  /* Must stay FIXED, not intrinsic: the readout is the widest thing in the
     split column, so an intrinsic width makes the column — and the mixer's
     strips beside it — move as the note name changes width ("F#3" vs "F3").
     26 px clears the widest name the 12..96 range produces ("A#0") at 10 px
     bold condensed; `nowrap` keeps a name that ever exceeds it on one line
     rather than pushing the label row's height. */
  width: 26px;
  white-space: nowrap;
}

/* Split disabled: the point is inert, so grey it out. The toggle below stays
   live — it is what turns the split back on. */
.split-point-row.dimmed { opacity: 0.4; pointer-events: none; }

/* Pinned like the mutes, so the mixer's bottom line reads as one row of
   toggles across the panel. */
.split-enable-slot {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  display: flex;
  justify-content: center;
}

/* A split needs two layers, and so does Layer 2's mixer strip. Both dim
   (rather than vanish) while Layer 2 is off so the layout never jumps as the
   layer toggles — same idiom as the existing `.dimmed` rules. */
[data-layer2-gated].dimmed { opacity: 0.4; pointer-events: none; }

/* ── Dynamics ──────────────────────────────────────────────────────────── */
/* Meter clusters flank the controls in signal order: In at the panel's left
   edge, GR + Out on the right. Labels above the bars, like every fader cell,
   so the labels line up with the dial labels and the bars with the tracks. */
.dyn-meters {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 7px;
  flex: 0 0 auto;
  /* A cluster is label + bar, which is shorter than a control column; without
     the column's height the body centres it and the bars land ~8 px below the
     fader tracks they are read against. */
  height: var(--col-h);
}
/* The input cluster is a single column at the far left; no extra leading gap,
   the panel padding already sets it off. */
.dyn-meters-in { margin-right: 2px; }

/* Same column shape as a fader cell (label, then bar) so the meter labels sit
   on the dial-label line and the bars on the fader-track line. */
.dyn-meter-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--ctl-gap);
}

/* The GR bar is single-channel, so give it a wider bar than a stereo pair —
   it reads as one quantity rather than half a missing pair. Tracks the row's
   widened pair (8 px) rather than sitting at a fixed figure. */
.meter-gr .meter-bar { width: 12px; }

/* Shared preset browser panel. Floating two-pane folders/presets list,
 * anchored to the editor viewport, ported from VXN1. Outside-click + ESC
 * dismiss; content scrolls inside each pane. Embedded by each synth's
 * faceplate crate; the synth's own stylesheet must make its faceplate root
 * `position: relative` (or the panel anchors to the viewport, which is
 * equivalent when the editor fills the WebView). */
.browser-panel[hidden],
.browser-backdrop[hidden] { display: none !important; }
.browser-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  /* Invisible — swallows outside clicks and routes them to close. */
}
.browser-panel {
  position: fixed;
  top: calc(var(--pad-outer) + var(--banner-h) + var(--row-vgap)
           + var(--preset-bar-h) + var(--row-vgap));
  left: var(--pad-outer);
  width: 760px;
  max-width: calc(var(--editor-w) - 2 * var(--pad-outer));
  height: 420px;
  z-index: 60;
  background: var(--panel-bg);
  border: 1px solid var(--ctl-value);
  border-radius: var(--panel-corner);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  padding: 8px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.browser-close {
  position: absolute;
  top: 6px;
  right: 8px;
  z-index: 1;
  background: transparent;
  border: none;
  color: var(--ctl-label);
  font: inherit;
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  cursor: pointer;
  user-select: none;
}
.browser-close:hover { color: #ececec; }
.browser-search {
  position: relative;
  height: 22px;
  flex: 0 0 auto;
  width: 220px;
}
.browser-search input {
  width: 100%;
  background: #0e0e0e;
  border: 1px solid #2a2a2a;
  border-radius: 2px;
  color: var(--text);
  font: inherit;
  font-size: 12px;
  height: 22px;
  padding: 0 22px 0 6px;
  box-sizing: border-box;
  outline: none;
}
.browser-search input:focus { border-color: var(--glyph-active); }
.browser-search-clear {
  position: absolute;
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 2px;
  color: var(--ctl-label);
  font-family: inherit;
  font-size: 12px;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  user-select: none;
}
.browser-search-clear:hover { color: #ececec; }
.browser-panes {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: 6px;
}
.browser-pane {
  background: #0e0e0e;
  border: 1px solid #2a2a2a;
  border-radius: 2px;
  overflow-y: auto;
  padding: 2px;
  box-sizing: border-box;
}
.browser-pane-folders { width: 220px; flex: 0 0 220px; }
.browser-pane-presets { flex: 1 1 auto; }
.browser-section {
  font-size: 9px;
  color: var(--ctl-value);
  letter-spacing: 1px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 4px 4px;
  height: 22px;
  box-sizing: border-box;
  display: flex;
  align-items: flex-end;
}
.browser-row {
  font-size: 12px;
  color: var(--text);
  padding: 3px 8px;
  border-radius: 2px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 16px;
}
.browser-row:hover { background: #1c1c1c; }
.browser-row.selected {
  background: #1c1c1c;
  color: #ececec;
  box-shadow: inset 2px 0 0 var(--ctl-value);
}
.browser-row.current {
  color: var(--ctl-value);
  font-weight: 600;
}
/* HTML5 DnD: dim the dragged source row, highlight a valid drop folder, dim
 * the source folder when hovered (no-op drop). */
.browser-row.dragging { opacity: 0.5; }
.browser-row.drag-over {
  background: #2a2a2a;
  color: #ececec;
  box-shadow: inset 2px 0 0 var(--glyph-active);
}
.browser-row.drag-blocked {
  opacity: 0.4;
  cursor: not-allowed;
}
/* Search rows: name + muted origin label so cross-folder matches read
 * unambiguously. */
.browser-row.search-row { display: flex; align-items: baseline; gap: 8px; }
.browser-row.search-row .browser-row-name {
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
}
.browser-row.search-row .browser-row-origin {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--ctl-label);
  letter-spacing: 0.3px;
}
.browser-empty {
  font-size: 11px;
  color: var(--ctl-label);
  padding: 8px;
  font-style: italic;
}
/* "+ New" button on the USER section header. */
.browser-section-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-right: 4px;
}
.browser-section-row .browser-section { flex: 1 1 auto; padding-right: 0; }
.browser-new-folder {
  flex: 0 0 auto;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 2px;
  color: var(--ctl-label);
  font: inherit;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 1px 5px;
  height: 16px;
  cursor: pointer;
  user-select: none;
  margin-bottom: 4px;
}
.browser-new-folder:hover { border-color: var(--glyph-active); color: #ececec; }

/* Right-click context menu. Mounts inside the panel, positioned at the
 * click. The "Move to ▸" submenu shows on hover via CSS. */
.browser-menu {
  position: absolute;
  z-index: 70;
  background: #1c1c1c;
  border: 1px solid var(--ctl-value);
  border-radius: 2px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  padding: 2px 0;
  min-width: 120px;
}
.browser-menu-item {
  position: relative;
  font-size: 12px;
  color: var(--text);
  padding: 4px 12px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.browser-menu-item:hover { background: #2a2a2a; }
.browser-menu-item.has-submenu::after {
  content: '▸';
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ctl-label);
  font-size: 10px;
}
.browser-submenu {
  display: none;
  position: absolute;
  left: 100%;
  top: -3px;
  background: #1c1c1c;
  border: 1px solid var(--ctl-value);
  border-radius: 2px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  padding: 2px 0;
  min-width: 120px;
  max-height: 240px;
  overflow-y: auto;
}
.browser-menu-item.has-submenu:hover > .browser-submenu { display: block; }
.browser-submenu-item {
  font-size: 12px;
  color: var(--text);
  padding: 4px 12px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.browser-submenu-item:hover { background: #2a2a2a; }
.browser-submenu-empty {
  font-size: 11px;
  color: var(--ctl-label);
  padding: 4px 12px;
  font-style: italic;
}
/* Confirm + Save As modals. Mounted on the faceplate root; fixed overlay
 * above the panel. */
.browser-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(0, 0, 0, 0.55);
}
.browser-modal {
  position: fixed;
  z-index: 81;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #1c1c1c;
  border: 1px solid var(--ctl-value);
  border-radius: var(--panel-corner);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6);
  padding: 14px 18px;
  min-width: 260px;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.browser-modal-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--ctl-value);
}
.browser-modal-body {
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
  word-break: break-word;
}
.browser-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}
.browser-modal-btn {
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 2px;
  color: var(--ctl-label);
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 4px 12px;
  cursor: pointer;
  user-select: none;
}
.browser-modal-btn:hover { border-color: var(--glyph-active); color: #ececec; }
.browser-modal-btn.danger { border-color: #ff5050; color: #ff7676; }
.browser-modal-btn.danger:hover { background: #2a1414; color: #ffb0b0; }
.browser-modal-btn.disabled,
.browser-modal-btn:disabled { opacity: 0.4; pointer-events: none; }
/* Save As form: two label + control rows. */
.save-as-body { display: flex; flex-direction: column; gap: 8px; min-width: 320px; }
.save-as-row { display: flex; align-items: center; gap: 8px; }
.save-as-label {
  flex: 0 0 56px;
  font-size: 10px;
  color: var(--ctl-label);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.save-as-name {
  flex: 1 1 auto;
  background: #0e0e0e;
  border: 1px solid #2a2a2a;
  border-radius: 2px;
  color: var(--text);
  font-size: 12px;
  padding: 4px 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.save-as-name.placeholder { color: var(--ctl-label); font-style: italic; }
.save-as-select {
  flex: 1 1 auto;
  background: #0e0e0e;
  border: 1px solid #2a2a2a;
  border-radius: 2px;
  color: var(--text);
  font: inherit;
  font-size: 12px;
  height: 24px;
  padding: 0 6px;
  cursor: pointer;
}
.save-as-select:focus { outline: none; border-color: var(--glyph-active); }

/* Floating value popup — one shared <div> across every control, anchored
   at the pointer's entry / grab point in fixed coords so it floats above
   the layout and can never push siblings around or be clipped by a panel's
   overflow. Shared ruleset (0140): replaces the per-synth `.value-pop`
   copies in VXN1 `faceplate.css` and VXN2 `style.css`.

   `--track-bg` and `--ctl-value` are theme custom properties both synths
   define (VXN1 `faceplate.css`, VXN2 `style.css`); the fallback keeps the
   rule valid if a host page omits them. */
.value-pop {
  position: fixed;
  display: none;
  pointer-events: none;
  background: var(--track-bg, #0e0e0e);
  border: 1px solid var(--ctl-value);
  border-radius: 3px;
  padding: 2px 5px;
  font-size: 10px;
  color: #f6f6f6;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  z-index: 1000;
}

</style>
</head>
<body>
<div class="faceplate" id="faceplate">

  <div class="banner">VULPUS LABS &mdash; VXN-1b</div>

  <!-- Preset bar (0049). Prev/next walk the combined Factory + User
       list (controller-side via UiEvent::StepPreset); Browse toggles a
       view-side `browserOpen` flag 0050 will bind a panel to; Save As
       opens the 0048 floating popup, committing to the browser panel's
       currently-selected folder. -->
  <div class="preset-bar-slot" id="preset-bar-slot">
    <button class="pbar-btn pbar-step" id="pbar-prev" type="button" aria-label="Previous preset">&lt;</button>
    <div class="pbar-name" id="pbar-name"></div>
    <button class="pbar-btn pbar-step" id="pbar-next" type="button" aria-label="Next preset">&gt;</button>
    <button class="pbar-btn" id="pbar-browse" type="button">Browse</button>
    <button class="pbar-btn" id="pbar-save-overwrite" type="button" disabled>Save</button>
    <button class="pbar-btn" id="pbar-save" type="button">Save As</button>
    <!-- Copy Layer 1 → Layer 2. A PatchOp, not a param, so it is hand-wired in
         dispatch.js. It lives in the upper bar rather than on a layer panel
         because it is a whole-patch operation like load/save, and because the
         direction is fixed (L1 → L2) regardless of which layer is being
         edited. Destructive — it overwrites Layer 2 and lands ~66 param changes
         in the host's undo stack as one burst — so it opens a confirmation. -->
    <button class="pbar-btn" id="copy-layer" type="button">Copy L1 &rarr; L2</button>
    <!-- Reset the EDIT layer to the factory patch (0307). Unlike Copy its
         direction is not fixed, so the label tracks the layer tab and
         `wireResetLayer` restamps it on every flip. Destructive in the same way
         Copy is, so it takes the same confirmation. -->
    <button class="pbar-btn" id="reset-layer" type="button">Reset L1</button>
    <div class="pbar-spacer"></div>
    <div class="status-pill" id="pbar-status"></div>
  </div>

  <!-- Preset browser panel (0050). Two-pane folders / presets list with a
       case-insensitive substring search across the selected folder. Hidden
       until the preset bar's Browse toggle flips on; populated from the
       controller's corpus snapshot pushed via
       `window.__vxn.applyPresetCorpus`. -->
  <div class="browser-backdrop" id="browser-backdrop" hidden></div>
  <div class="browser-panel" id="browser-panel" hidden>
    <button class="browser-close" id="browser-close" type="button" aria-label="Close browser">&times;</button>
    <div class="browser-search">
      <input type="text" id="browser-search-input" placeholder="Search…" autocomplete="off" />
      <button class="browser-search-clear" id="browser-search-clear" type="button" aria-label="Clear search">&times;</button>
    </div>
    <div class="browser-panes">
      <div class="browser-pane browser-pane-folders" id="browser-folders"></div>
      <div class="browser-pane browser-pane-presets" id="browser-presets"></div>
    </div>
  </div>

  <!-- Mod-matrix modal (0219, ported from vxn-2). A dismissible overlay — close
       button, backdrop click, or Esc — over the whole faceplate, so it never
       traps the tab. panels/matrix.js fills #matrix-rows and wires open/close. -->
  <div class="overlay-backdrop mm-backdrop" id="matrix-backdrop" hidden>
    <div class="overlay-panel mm-overlay">
      <button class="overlay-close" id="matrix-close" type="button" aria-label="Close mod matrix">&times;</button>
      <div class="overlay-title">Mod Matrix &mdash; <span id="matrix-layer-label">Layer 1</span></div>
      <div class="mm-overlay-list" id="matrix-rows"></div>
    </div>
  </div>

  <!-- Confirmation modal. Generic — title / message / two buttons — driven by
       `confirmDialog.ask()` in dispatch.js, currently for Copy L1 → L2. Same
       dismissal contract as the matrix overlay (button, backdrop, Esc), and
       cancelling is the default: the backdrop and Esc both resolve to "no". -->
  <div class="overlay-backdrop confirm-backdrop" id="confirm-backdrop" hidden>
    <div class="overlay-panel confirm-panel">
      <div class="overlay-title" id="confirm-title"></div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="confirm-actions">
        <button class="pbar-btn" id="confirm-cancel" type="button">Cancel</button>
        <button class="pbar-btn confirm-ok" id="confirm-ok" type="button">OK</button>
      </div>
    </div>
  </div>

  <!-- Three-tab shell (0219, ADR 0002 §8). Layer 1 / Layer 2 select the edit
       layer (the patch surface rebinds via the 0045 machinery — Layer 1 = Upper,
       Layer 2 = Lower); FX / Global shows the shared global panels. The tab strip
       subsumes VXN1's separate edit-layer toggle. -->
  <div class="tab-strip" id="tab-strip" role="tablist">
    <button type="button" class="tab-btn active" data-tab="layer" data-layer="upper" role="tab">LAYER 1</button>
    <!-- Layer 2's enable switch lives ON its tab (0219), the way each FX tab
         carries its own on/off. Toggling it on also selects the Layer 2 tab
         (the switch click bubbles to the tab button). Off → Layer 2 bypassed. -->
    <button type="button" class="tab-btn" data-tab="layer" data-layer="lower" role="tab">
      <span class="tab-switch" id="layer2-enable" role="switch" aria-label="Enable Layer 2"></span>
      LAYER 2
    </button>
    <button type="button" class="tab-btn" data-tab="global" role="tab">FX / GLOBAL</button>
  </div>

  <!-- Layer pane — the per-layer patch surface, shared by the Layer 1 / Layer 2
       tabs. Every panel here is `data-layered`, so a tab flip rebinds each cell
       to the active layer's CLAP ids (Lower = Upper + patchCount). -->
  <div class="tab-pane active" data-tab-pane="layer" data-edit-layer="upper">

  <!-- Row 1 — oscillators, mixer, filter. -->
  <div class="row row-1" data-row="1">
