    <!-- Osc 1 (0041): Wave (rotary) + 4 faders, with Free in the bottom strip
         (0283) — same idiom as LFO 1's Free: a quirk of the oscillator as a
         whole, not a modifier on any one fader. On, the phase accumulator runs
         across note-ons instead of being stamped. Layer hard-bound to Upper —
         the edit-layer toggle lands with the Voice panel in 0045. The faders
         resolve by descriptor name, not CLAP id, so a `vxn_app::PatchParam`
         reorder doesn't desync the HTML. -->
    <div class="panel" data-name="Osc 1" data-layered>
      <div class="panel-header">OSC 1</div>
      <div class="panel-body">
        <div class="ctl" data-control="wave" data-param="osc1_wave" data-label="Wave"></div>
        <div class="ctl" data-control="fader" data-param="osc1_octave" data-label="Oct"></div>
        <div class="ctl" data-control="fader" data-param="osc1_coarse" data-label="Semi"></div>
        <div class="ctl" data-control="fader" data-param="osc1_fine" data-label="Fine"></div>
        <div class="ctl" data-control="fader" data-param="osc1_pw" data-label="PW"></div>
      </div>
      <div class="panel-strip">
        <div class="ctl-strip" data-control="switch" data-param="osc1_free_run" data-label="Free"></div>
      </div>
    </div>
    <!-- Osc 2 (0041a): identical control set to Osc 1, different param IDs —
         including its own Free (0283), independent of Osc 1's. -->
    <div class="panel" data-name="Osc 2" data-layered>
      <div class="panel-header">OSC 2</div>
      <div class="panel-body">
        <div class="ctl" data-control="wave" data-param="osc2_wave" data-label="Wave"></div>
        <div class="ctl" data-control="fader" data-param="osc2_octave" data-label="Oct"></div>
        <div class="ctl" data-control="fader" data-param="osc2_coarse" data-label="Semi"></div>
        <div class="ctl" data-control="fader" data-param="osc2_fine" data-label="Fine"></div>
        <div class="ctl" data-control="fader" data-param="osc2_pw" data-label="PW"></div>
      </div>
      <div class="panel-strip">
        <div class="ctl-strip" data-control="switch" data-param="osc2_free_run" data-label="Free"></div>
      </div>
    </div>
    <!-- Mixer (0041a, 0061, 0062): four level faders + Col (White/Pink) as a
         column of its own. NoiseColor is a 2-variant enum — one choice with two
         positions, not two independent things to enable — so it draws as a
         rocker beside the faders rather than as a pair of checkboxes in the
         bottom strip. Sub is a square one octave below the source osc, on its
         own accumulator (0281). -->
    <div class="panel" data-name="Mixer" data-layered>
      <div class="panel-header">MIXER</div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="osc1_level" data-label="Osc1"></div>
        <div class="ctl" data-control="fader" data-param="osc2_level" data-label="Osc2"></div>
        <div class="ctl" data-control="fader" data-param="sub_level" data-label="Sub"></div>
        <div class="ctl" data-control="fader" data-param="noise_level" data-label="Noise"></div>
        <div class="ctl-strip" data-control="rocker" data-param="noise_color"></div>
      </div>
    </div>
    <!-- Filter (0043): HPF/Cutoff/Reso/Drive faders + Mode button group
         (vizia's `Ctl::Select` for FilterMode renders as a labelled-toggle
         stack via `enum_list_body`). Slope (12/24 dB) is a rocker sitting
         beside Mode — the two together are the filter's shape, and a rocker
         says "one choice, two positions" where the old pair of strip
         checkboxes said "two things you can each enable". -->
    <div class="panel" data-name="Filter" data-layered>
      <div class="panel-header">FILTER</div>
      <div class="panel-body">
        <div class="ctl" data-control="buttongroup" data-param="filter_mode" data-label="Mode"></div>
        <div class="ctl-strip" data-control="rocker" data-param="filter_slope"></div>
        <div class="ctl" data-control="fader" data-param="hpf_cutoff" data-label="HPF"></div>
        <!-- Tuned (0250): note-precise cutoff. The fader re-maps to semitones
             over MIDI C0..C4 and reads out as a note name; the stored param
             stays Hz, so DSP and host automation are untouched. It rides
             directly under the fader it re-maps, centred on it, rather than in
             the bottom strip where nothing said which fader it governed. -->
        <div class="ctl-col ctl-col-center">
          <div class="ctl" data-control="fader" data-param="cutoff" data-label="Cutoff"></div>
          <div class="ctl-strip" data-control="switch" data-param="cutoff_tuned" data-label="Tuned"></div>
        </div>
        <!-- Key-track (0245): dedicated param, VXN1's control — 1.0 = 1 oct of
             cutoff per oct of key, pivoting at C0, so with Cutoff at its
             minimum (C0's 16.35 Hz) the filter tracks the played note. -->
        <div class="ctl" data-control="fader" data-param="filter_key_track" data-label="Key"></div>
        <div class="ctl" data-control="fader" data-param="resonance" data-label="Reso"></div>
        <div class="ctl" data-control="fader" data-param="drive" data-label="Drive"></div>
      </div>
    </div>
  </div>

  <!-- Row 2 — LFOs and envelopes (source shaping). -->
  <div class="row row-2" data-row="2">
    <!-- LFO 1 (0042): per-voice. Shape (rotary) + Rate/Delay/Fade faders in
         the main row. Sync rides under the Rate fader, centred on it — it is
         Rate's own modifier (it swaps Hz for a musical subdivision), so it
         belongs with the fader rather than in the strip. Free stays in the
         bottom strip: it is a quirk of the LFO as a whole — when on, it keeps
         the LFO free-running and the Delay/Fade cells dim. -->
    <div class="panel" data-name="LFO 1" data-layered>
      <div class="panel-header">LFO 1</div>
      <div class="panel-body">
        <div class="ctl" data-control="wave" data-param="lfo1_shape" data-label="Shape"></div>
        <div class="ctl-col ctl-col-center">
          <div class="ctl" data-control="fader" data-param="lfo1_rate" data-label="Rate"></div>
          <div class="ctl-strip" data-control="switch" data-param="lfo1_sync" data-label="Sync"></div>
        </div>
        <div class="ctl" data-control="fader" data-param="lfo1_delay_time" data-label="Delay"></div>
        <div class="ctl" data-control="fader" data-param="lfo1_fade" data-label="Fade"></div>
      </div>
      <div class="panel-strip">
        <div class="ctl-strip" data-control="switch" data-param="lfo1_free_run" data-label="Free"></div>
      </div>
    </div>
    <!-- LFO 2 (0042): per-layer since 0216 (VXN1b has no global LFO — ADR 0002
         §4). Shape + Rate up top with Sync centred under the Rate fader (same
         pairing as LFO 1); rebinds with its layer.
         Link (0217) is the one cross-layer coupling — Layer 2's LFO 2 slaves to
         Layer 1's (rate + phase). It is KeyState, not a param, so it carries no
         `data-control`/`data-param` and is wired by hand in dispatch.js; CSS
         shows it on the Layer 2 tab only. -->
    <div class="panel" data-name="LFO 2" data-layered>
      <div class="panel-header">LFO 2</div>
      <div class="panel-body">
        <div class="ctl" data-control="wave" data-param="lfo2_shape" data-label="Shape"></div>
        <div class="ctl-col ctl-col-center">
          <div class="ctl" data-control="fader" data-param="lfo2_rate" data-label="Rate"></div>
          <div class="ctl-strip" data-control="switch" data-param="lfo2_sync" data-label="Sync"></div>
        </div>
      </div>
      <div class="panel-strip">
        <div class="ctl-strip" id="lfo2-link" data-layer2-only></div>
      </div>
    </div>
    <!-- Env 1 (0043): ADSR + Shape (Lin/Exp) as a fifth column. Lin and Exp
         are two positions of one curve choice, so — like NoiseColor and
         FilterSlope — the 2-variant enum draws as a rocker rather than as the
         pair of strip checkboxes vizia's `Ctl::Switch` produced. -->
    <div class="panel" data-name="Env 1" data-layered>
      <div class="panel-header">ENV 1</div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="env1_attack" data-label="A"></div>
        <div class="ctl" data-control="fader" data-param="env1_decay" data-label="D"></div>
        <div class="ctl" data-control="fader" data-param="env1_sustain" data-label="S"></div>
        <div class="ctl" data-control="fader" data-param="env1_release" data-label="R"></div>
        <div class="ctl-strip" data-control="rocker" data-param="env1_shape"></div>
      </div>
    </div>
    <div class="panel" data-name="Env 2" data-layered>
      <div class="panel-header">ENV 2</div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="env2_attack" data-label="A"></div>
        <div class="ctl" data-control="fader" data-param="env2_decay" data-label="D"></div>
        <div class="ctl" data-control="fader" data-param="env2_sustain" data-label="S"></div>
        <div class="ctl" data-control="fader" data-param="env2_release" data-label="R"></div>
        <div class="ctl-strip" data-control="rocker" data-param="env2_shape"></div>
      </div>
    </div>
  </div>

  <!-- Row 3 (layer) — Voice · Scope. The Layer 2 enable lives on the Layer 2
       tab. Cross Mod folded into Voice in the 0282 geometry pass: it was two
       cells in a panel of its own, ran 42 px short of the row, and cost a
       panel's worth of width that the scope and the new scope-side mixer
       controls make better use of. -->
  <div class="row row-layer-3" data-row="3">
    <!-- Voice (0045, 0266, + Cross Mod 0242/0282): the two orthogonal halves of
         the old AssignMode — Width (lanes per note) as a button group and Voice
         (Poly/Solo) as a rocker under it, with Legato under that; the three read
         as one group because they answer one question. Legato only bites in
         Solo, so a `legato-poly` dim rule greys it under Poly — it used to be
         drawn by a Detune+Legato composite that existed for no other reason.
         Detune fans the stack across its full 0–50 ct at every width; Glide
         (0 = off), Spread, and 0284's Phase + Distrib are plain faders. -->
    <div class="panel" data-name="Voice" data-layered>
      <div class="panel-header">VOICE</div>
      <div class="panel-body">
        <!-- The voice-allocation stack: Width, then how it is played. Six
             widths in a single vertical list is taller than the panel, so the
             button group runs in TWO ROWS of three, read across
             (`data-columns="3" data-flow="row"`: 1 · 2 · 4 over 8 · 16 · 32) —
             which also reads as what it is, a doubling scale.
             Poly/Solo and Legato sit under it in the same column rather than
             beside it: all three answer "how does a note take lanes", and the
             rocker laid out horizontally spans the two width columns, which
             groups them visually without a rule. The rocker is horizontal here
             and vertical everywhere else (`data-orient="h"`) precisely because
             it is the one that has a width to span. -->
        <div class="ctl-col voice-stack">
          <div class="ctl" data-control="buttongroup" data-param="stack_width" data-label="Width" data-columns="3" data-flow="row"></div>
          <div class="ctl-strip voice-mode" data-control="rocker" data-param="voice_mode" data-orient="h"></div>
          <div class="ctl-strip voice-legato" data-control="switch" data-param="legato" data-label="Legato"></div>
        </div>
        <div class="ctl" data-control="fader" data-param="unison_detune" data-label="Detune"></div>
        <div class="ctl" data-control="fader" data-param="portamento_time" data-label="Glide"></div>
        <div class="ctl" data-control="fader" data-param="spread" data-label="Spread"></div>
        <!-- Stack voicing (0284). Phase scales the per-lane random start phase a
             stacked note takes: 0 starts the copies coherent, 1 is the full
             scatter the engine used to hardwire (hence the default). It dims
             when BOTH oscillators free-run — a free-running oscillator ignores
             the stamped start phase, so with both on nothing consumes the value;
             one on and one off leaves it live on the locked oscillator.
             Distrib is the layout law for the lane positions that drive the
             detune fan and, via Spread, the stereo fan — VXN2's Linear /
             Geometric / Random. -->
        <div class="ctl" data-control="fader" data-param="stack_phase" data-label="Phase"></div>
        <div class="ctl" data-control="buttongroup" data-param="stack_distrib" data-label="Distrib"></div>
        <!-- Cross Mod (0242), folded in here by 0282. Still patch topology —
             how the two oscillators are wired to each other, not a modulation
             depth — which is why it is on the faceplate and not in the matrix
             overlay; but two cells did not earn a panel. The rule separates it
             from the voice-allocation columns so the panel reads as the two
             groups it is. The group label says "Cross Mod" rather than "Type"
             now that the panel header no longer says it.
             The descriptor labels PM as "FM" — players expect that name (VXN1
             ADR 0004 §3). Amount drives PM only, so it dims for Off/Sync/Ring
             via the generic `unless-fm` dim rule. It is also a mod-matrix
             destination (Cross Mod Amt), applied per voice on top of it. -->
        <div class="panel-sep"></div>
        <div class="ctl" data-control="buttongroup" data-param="cross_mod_type" data-label="Cross Mod"></div>
        <div class="ctl" data-control="fader" data-param="cross_mod_amount" data-label="FM Amt" data-dim-unless-fm="cross_mod_type"></div>
      </div>
      <!-- Mod-matrix opens from here (it edits the layer's routing, so it
           belongs with the layer's panels). `panels/matrix.js` binds by id, so
           the button's home is purely a markup decision. -->
      <div class="panel-strip">
        <button class="pbar-btn" id="matrix-toggle" type="button">Mod Matrix</button>
      </div>
    </div>

    <!-- Layer scope. Shows the edit layer's post-fader, post-pan output — the
         same tap the mixer's L1/L2 meters read, so the trace and the bar agree.
         Not a param cell: no `data-control`/`data-param`, so `rebindAllForLayer`
         never touches it. It follows the edit layer by posting a
         `set_scope_source` op on every tab flip, which is also what points the
         audio thread's capture ring — nothing is captured for a layer that is
         not on screen. -->
    <div class="panel panel-scope" data-name="Scope">
      <div class="panel-header">SCOPE</div>
      <div class="panel-body">
        <div class="scope-mount" data-scope="layer"></div>
        <!-- Edit-layer level / pan / detune, the same params the FX pane's
             mixer strips drive (0282). Bound twice on purpose: the dispatcher
             fans a `param_changed` echo out to every updater registered on the
             id, so moving either copy moves the other. -->
        <div class="scope-strip" data-layered>
          <div class="strip-title">LAYER</div>
          <div class="scope-strip-body">
            <!-- Meter to the LEFT of its fader, as in the mixer. `scope` is not
                 a key any meter frame carries: the mount registers (so the
                 registry's rAF loop renders it) but `apply` never feeds it, and
                 the dispatcher pushes the EDIT layer's pair into it instead —
                 which is the same tap the trace beside it is drawn from. -->
            <div class="meter-mount" data-meter="scope"></div>
            <div class="ctl" data-control="fader" data-param="layer_level" data-label="Level" data-no-label></div>
            <div class="strip-dials">
              <div class="ctl strip-dial" data-control="dial" data-param="layer_pan" data-label="Pan"></div>
              <div class="ctl strip-dial" data-control="dial" data-param="layer_detune" data-label="Detune"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  </div><!-- /tab-pane layer -->

  <!-- FX / Global pane (0220, ADR 0002 §8) — the mixer / split / global
       surface above the FX chain. -->
  <div class="tab-pane" data-tab-pane="global">

  <!-- Row 1 (global) — layer mixer + keyboard split (0220).

       The two layer strips are FIXED to their layer (`data-fixed-layer`), not
       `data-layered`: this is the mixer, so both layers must be visible and
       adjustable at once regardless of which layer tab is being edited. That is
       the whole point of a mixer strip, and it is why these cells opt out of
       the edit-layer rebind machinery.

       `layer_level` / `layer_mute` / `layer_pan` are ordinary per-layer CLAP
       params, so the faders, pan dials and mutes are normal bound cells. The
       meters are not — they carry `data-meter` only, hold no model state, and
       are mounted by `wireMeters`. -->
  <div class="row row-global-1" data-row="1">
    <!-- Narrow mixer: two channel strips, split beneath them. Each strip is
         [meter | fader | pan+detune dials] — meter to the LEFT of its fader,
         the channel-strip convention, with the two dials stacked in a column
         beside them — and the mute centred under the lot. The strip title
         names the layer, so per-cell "Level" / "Lvl" labels would only repeat
         what the column already says; both are dropped. -->
    <div class="panel panel-mixer" data-name="Mixer">
      <div class="panel-header">MIXER</div>
      <div class="panel-body mixer-body">
        <div class="mixer-strips">
          <div class="mixer-strip">
            <div class="strip-title">LAYER 1</div>
            <div class="mixer-strip-body">
              <div class="meter-mount" data-meter="l1"></div>
              <div class="ctl" data-control="fader" data-param="layer_level"
                   data-fixed-layer="upper" data-label="Level" data-no-label></div>
              <div class="strip-dials">
                <div class="ctl strip-dial" data-control="dial" data-param="layer_pan"
                     data-fixed-layer="upper" data-label="Pan"></div>
                <div class="ctl strip-dial" data-control="dial" data-param="layer_detune"
                     data-fixed-layer="upper" data-label="Detune"></div>
              </div>
            </div>
            <div class="ctl-strip mixer-mute" data-control="switch" data-param="layer_mute"
                 data-fixed-layer="upper" data-label="Mute"></div>
          </div>
          <div class="mixer-strip" data-layer2-gated>
            <div class="strip-title">LAYER 2</div>
            <div class="mixer-strip-body">
              <div class="meter-mount" data-meter="l2"></div>
              <div class="ctl" data-control="fader" data-param="layer_level"
                   data-fixed-layer="lower" data-label="Level" data-no-label></div>
              <div class="strip-dials">
                <div class="ctl strip-dial" data-control="dial" data-param="layer_pan"
                     data-fixed-layer="lower" data-label="Pan"></div>
                <div class="ctl strip-dial" data-control="dial" data-param="layer_detune"
                     data-fixed-layer="lower" data-label="Detune"></div>
              </div>
            </div>
            <div class="ctl-strip mixer-mute" data-control="switch" data-param="layer_mute"
                 data-fixed-layer="lower" data-label="Mute"></div>
          </div>
        </div>

        <!-- Split sits UNDER the two sliders, inside the mixer panel — it is a
             property of how the two layers share the keyboard, so it belongs
             with them rather than in a panel of its own. Enable + point are
             KeyState, not CLAP params (ADR 0002 §3), so like the LFO 2 link
             they carry no `data-control`/`data-param` and are hand-wired in
             dispatch.js. Dims with Layer 2: a split needs two layers. -->
        <div class="mixer-split" data-layer2-gated>
          <!-- Point above, enable below: the slider gets the panel's full width
               so a semitone is a comfortable drag target, instead of sharing
               the row with the toggle. The point row dims when the split is
               off — the control is inert then, and the toggle beneath it stays
               live so it can be turned back on. -->
          <div class="split-point-row" id="split-point-row">
            <!-- Range and default are stamped by `wireSplit` from dispatch.js's
                 SPLIT_MIN / SPLIT_MAX / SPLIT_DEFAULT, so the numbers live in
                 one place and are pinned to the engine (0316). -->
            <input type="range" class="split-point-slider" id="split-point-slider" />
            <div class="split-point-readout" id="split-point-readout">C4</div>
          </div>
          <div class="split-enable-slot" id="split-enable"></div>
        </div>
      </div>
    </div>

    <!-- Dynamics (E037 / 0207, reworked 0208, moved to the top row + metered
         0241). On/off is a header toggle (VXN1 idiom) bound to dynamics_on.
         Six kernel params in a 3×2 dial grid, Mix as a fader, then the meter
         cluster: input stereo, gain reduction (single, drawn downward from
         0 dB), output stereo. In / GR / Out left to right is signal order,
         so the reduction reads between the levels it sits between. -->
    <div class="panel" data-name="Dynamics" data-header-toggle>
      <div class="panel-header">
        <span class="panel-header-toggle-slot" data-control="header-switch" data-param="dynamics_on"></span>
        <span class="panel-header-title">DYNAMICS</span>
      </div>
      <div class="panel-body dynamics-body">
        <!-- Input meter sits at the panel's left edge, before the controls:
             signal enters here, so the panel reads in → controls → GR/out. -->
        <div class="dyn-meters dyn-meters-in">
          <div class="dyn-meter-col">
            <div class="ctl-label">In</div>
            <div class="meter-mount" data-meter="dynIn"></div>
          </div>
        </div>
        <div class="dial-grid">
          <div class="ctl" data-control="dial" data-param="dynamics_threshold" data-label="Thresh"></div>
          <div class="ctl" data-control="dial" data-param="dynamics_ratio" data-label="Ratio"></div>
          <div class="ctl" data-control="dial" data-param="dynamics_attack" data-label="Atk"></div>
          <div class="ctl" data-control="dial" data-param="dynamics_release" data-label="Rel"></div>
          <div class="ctl" data-control="dial" data-param="dynamics_makeup" data-label="Mkup"></div>
          <div class="ctl" data-control="dial" data-param="dynamics_drive" data-label="Drive"></div>
        </div>
        <div class="ctl" data-control="fader" data-param="dynamics_mix" data-label="Mix"></div>
        <div class="dyn-meters">
          <div class="dyn-meter-col">
            <div class="ctl-label">GR</div>
            <div class="meter-mount" data-meter="dynGr" data-meter-kind="gr"></div>
          </div>
          <div class="dyn-meter-col">
            <div class="ctl-label">Out</div>
            <div class="meter-mount" data-meter="dynOut"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Master (0045): Tune/Volume/Drift faders + the out meter; Oversample and
         Limit in the vertical bottom strip. -->
    <div class="panel" data-name="Master">
      <div class="panel-header">MASTER</div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="master_tune" data-label="Tune"></div>
        <div class="ctl" data-control="fader" data-param="master_volume" data-label="Volume"></div>
        <div class="ctl" data-control="fader" data-param="master_drift" data-label="Drift"></div>
        <!-- Master out meter (0240). Not a param cell: no data-control /
             data-param, so `rebindAllForLayer` never touches it. -->
        <div class="ctl ctl-meter">
          <div class="ctl-label">Out</div>
          <div class="meter-mount" data-meter="master"></div>
        </div>
      </div>
      <div class="panel-strip master-strip">
        <div class="ctl-strip" data-control="switch" data-param="oversample" data-label="OvSmp"></div>
        <div class="ctl-strip" data-control="switch" data-param="limiter_on" data-label="Limit"></div>
      </div>
    </div>
  </div>

  <!-- Row 2 (global) — the four time-domain effects, each its own section with
       an on/off toggle in its header (the Dynamics idiom).

       This replaces the single tabbed FX panel: a left tab strip showed one
       effect at a time and left roughly three-quarters of the panel empty,
       while the faceplate is wide enough to carry all four side by side. Four
       headers also means all four on/off states are readable at a glance
       instead of only the selected tab's. -->
  <div class="row row-global-2" data-row="2">
    <div class="panel" data-name="Phaser" data-header-toggle>
      <div class="panel-header">
        <span class="panel-header-toggle-slot" data-control="header-switch" data-param="phaser_on"></span>
        <span class="panel-header-title">PHASER</span>
      </div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="phaser_rate" data-label="Rate"></div>
        <div class="ctl" data-control="fader" data-param="phaser_depth" data-label="Depth"></div>
        <div class="ctl" data-control="fader" data-param="phaser_fb" data-label="FB"></div>
        <div class="ctl" data-control="fader" data-param="phaser_stereo" data-label="Stereo"></div>
        <div class="ctl" data-control="fader" data-param="phaser_mix" data-label="Mix"></div>
      </div>
    </div>
    <div class="panel" data-name="Chorus" data-header-toggle>
      <div class="panel-header">
        <span class="panel-header-toggle-slot" data-control="header-switch" data-param="chorus_on"></span>
        <span class="panel-header-title">CHORUS</span>
      </div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="chorus_rate" data-label="Rate"></div>
        <div class="ctl" data-control="fader" data-param="chorus_depth" data-label="Depth"></div>
        <div class="ctl" data-control="fader" data-param="chorus_mix" data-label="Mix"></div>
      </div>
    </div>
    <div class="panel" data-name="Delay" data-header-toggle>
      <div class="panel-header">
        <span class="panel-header-toggle-slot" data-control="header-switch" data-param="delay_on"></span>
        <span class="panel-header-title">DELAY</span>
      </div>
      <div class="panel-body">
        <!-- Tempo sync (0267): flips Time from seconds to a musical
             subdivision, same rate↔sync pairing as the two LFOs — and drawn
             the same way, centred under the fader it re-maps rather than in
             the bottom strip. -->
        <div class="ctl-col ctl-col-center">
          <div class="ctl" data-control="fader" data-param="delay_time" data-label="Time"></div>
          <div class="ctl-strip" data-control="switch" data-param="delay_sync" data-label="Sync"></div>
        </div>
        <div class="ctl" data-control="fader" data-param="delay_feedback" data-label="FB"></div>
        <!-- Ping-Pong (0277/0279): crossfeed toggle, drawn under Mix the way
             Sync sits under Time. -->
        <div class="ctl-col ctl-col-center">
          <div class="ctl" data-control="fader" data-param="delay_mix" data-label="Mix"></div>
          <div class="ctl-strip" data-control="switch" data-param="delay_pingpong" data-label="Ping-Pong"></div>
        </div>
      </div>
    </div>
    <div class="panel" data-name="Reverb" data-header-toggle>
      <div class="panel-header">
        <span class="panel-header-toggle-slot" data-control="header-switch" data-param="reverb_on"></span>
        <span class="panel-header-title">REVERB</span>
      </div>
      <div class="panel-body">
        <div class="ctl" data-control="fader" data-param="reverb_size" data-label="Size"></div>
        <div class="ctl" data-control="fader" data-param="reverb_decay" data-label="Decay"></div>
        <div class="ctl" data-control="fader" data-param="reverb_damp" data-label="Damp"></div>
        <div class="ctl" data-control="fader" data-param="reverb_mix" data-label="Mix"></div>
      </div>
    </div>
  </div>

  </div><!-- /tab-pane global -->

</div>

// web-boot-bpm.js — the WEB-ONLY tempo control (E045 delta 5).
//
// The plugin takes BPM from its host transport; a browser has no host, and
// `sync.rs` resolves every LFO and delay subdivision against a tempo, so
// without this the synced rates are stuck at the default forever.
//
// It lives in the bottom-left web-chrome row beside the CPU meter rather than
// on the faceplate: both are host-shaped readouts about the browser rather
// than parts of the instrument, so they belong together and away from the
// panels.
//
// Split out of `WEB_BOOT_HEAD`'s Rust string literal in 0320. Everything else
// in that literal is a template — it carries the double-underscore
// substitution tokens `assemble_faceplate` fills in, so it cannot be valid JS
// on its own. This half is, which is what lets the vitest glob reach it. It is
// spliced into a plain `<script>`, so the `export` markers are stripped on the
// way in — same treatment as every other module in `assets/`.
//
// Do not write a substitution token literally in this file, even inside a
// comment: the splice is a blind textual replace over the whole page, so the
// token would be filled in here too. `no_asset_contains_a_placeholder_token`
// enforces that.

/// Clamp a typed tempo to the range the engine will accept. `null` means "post
/// nothing".
///
/// Non-finite is rejected outright rather than clamped: it is not a slider that
/// ran past its end, it is a value that would divide through every synced rate
/// in the engine.
///
/// Blank is rejected for a subtler reason found when this got its first test in
/// 0320. `Number('')` is `0`, not `NaN`, so the original `isFinite` check let an
/// empty field through and clamped it to 20 — and a `<input type=number>` reads
/// back as `''` whenever its contents are invalid, so *clearing the box, or
/// typing a letter, slammed the tempo to 20 BPM*. Emptying a field is not a
/// tempo edit.
function clampBpm(raw) {
  if (raw == null) return null;
  if (typeof raw === 'string' && raw.trim() === '') return null;
  const bpm = Number(raw);
  if (!Number.isFinite(bpm)) return null;
  return Math.min(300, Math.max(20, bpm));
}

/// The shared bottom-left chrome row, created if the CPU meter has not mounted
/// yet — it boots asynchronously and this runs on DOMContentLoaded, so either
/// can be first. Same id, same styles, both idempotent; `order` decides the
/// layout rather than mount order.
function webChromeRow(doc) {
  let row = doc.getElementById('vxn-web-chrome');
  if (row) return row;
  row = doc.createElement('div');
  row.id = 'vxn-web-chrome';
  row.style.cssText =
    'position:fixed;left:10px;bottom:102px;z-index:9999;' +
    'display:flex;align-items:center;gap:8px;';
  doc.body.appendChild(row);
  return row;
}

/// Mount the BPM control and seed the engine with its starting value.
///
/// Posts through the same `window.ipc` as every other opcode, so it queues
/// before the bridge is up and routes to the ring afterwards — tempo has no
/// model presence, so there is no echo that could carry it.
function mountBpmControl(doc, ipc, defaultBpm) {
  const row = webChromeRow(doc);
  const wrap = doc.createElement('div');
  wrap.className = 'vxn-bpm';
  const label = doc.createElement('span');
  label.textContent = 'BPM';
  const input = doc.createElement('input');
  input.type = 'number';
  input.min = '20';
  input.max = '300';
  input.step = '1';
  input.value = String(defaultBpm);

  const send = () => {
    const bpm = clampBpm(input.value);
    if (bpm == null) return;
    // Write the clamped value back, so the field shows what was actually sent.
    input.value = String(bpm);
    ipc.postMessage(JSON.stringify({ op: 'set_tempo', bpm }));
  };
  input.addEventListener('change', send);
  // Typing a tempo must not trigger the faceplate's single-key shortcuts.
  input.addEventListener('keydown', (ev) => ev.stopPropagation());

  wrap.appendChild(label);
  wrap.appendChild(input);
  row.appendChild(wrap);
  // Seed the engine so a synced LFO is right before anyone touches this.
  send();
  return { input, send };
}

// Floating value popup — one shared <div> across every control, anchored
// at the pointer's first relevant position (entry for hover, grab for
// drag) so the popup stays put while the indicator moves. `fixed`
// positioning + body-level mount means it can't push any layout around
// or be clipped by a panel's overflow.
//
// Shared primitive (0140): both faceplates re-implemented this verbatim —
// VXN1's `bridge.js` `valuePop` and VXN2's `fader.js`
// `ensurePop/showPop/updatePop/hidePop`. Lifted here so there is one
// singleton + one `.value-pop` CSS ruleset (see `value-pop.css`).
//
// Authored as an ES module so the Node/vitest suites can pull `valuePop` in
// directly; the ESM marker is stripped at splice time (the synths concat every
// module into one inline `<script>` where module syntax is illegal) — see
// `strip_esm_exports` in the crate's `lib.rs`. The singleton's <div> is
// created lazily on first `show` so importing the module (e.g. only for the
// cutoff helpers) doesn't touch the DOM until a control actually needs it.
const valuePop = (() => {
  let el = null;
  function ensure() {
    if (el) return el;
    el = document.createElement('div');
    el.className = 'value-pop';
    document.body.appendChild(el);
    return el;
  }
  return {
    show(text, clientX, clientY) {
      const e = ensure();
      e.textContent = text;
      e.style.left = (clientX + 12) + 'px';
      e.style.top  = (clientY - 8)  + 'px';
      e.style.display = 'block';
    },
    update(text) { if (el) el.textContent = text; },
    hide() { if (el) el.style.display = 'none'; },
  };
})();

// Filter "Cutoff Tuned" mode math — shared primitive (0140).
//
// When a filter-cutoff fader is in tuned mode its range is read/displayed as
// a musical note over MIDI C0..C4 (12..60), semitone-snapped, while the
// stored param stays Hz so the DSP and DAW automation are unaffected (the
// engine never reads the toggle). Both faceplates had drifting three-way
// copies of these helpers — VXN1 `panels.js`, VXN2 `main.js` ("Mirrors
// VXN-1's panels.js") and VXN2 `bootstrap.js` (the bare `noteName`). One
// module now owns them.
//
// ES module so the vitest suites can `import` the pure helpers and assert
// the `cutoffTunedNormToHz` / `hzToMidi` round-trip directly; the `export`
// markers are stripped at splice time (see `strip_esm_exports`).

// Fader range: MIDI C0..C4, C2 at the midpoint.
const CUTOFF_TUNED_MIDI_MIN = 12; // C0
const CUTOFF_TUNED_MIDI_MAX = 60; // C4

function midiToHz(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}
function hzToMidi(hz) {
  return 69 + 12 * Math.log2(Math.max(1e-6, hz) / 440);
}

// MIDI note number → name (e.g. 60 → "C4"). General-purpose: `Math.round`
// tolerates a fractional MIDI value. Replaces VXN1's `keysNoteName` and the
// two VXN2 `noteName` copies.
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
function noteName(m) {
  const n = Math.round(m);
  return NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
}

// norm [0,1] → MIDI 12..60 (semitone-snapped) → Hz.
function cutoffTunedNormToHz(norm) {
  const span = CUTOFF_TUNED_MIDI_MAX - CUTOFF_TUNED_MIDI_MIN;
  const midi = Math.round(CUTOFF_TUNED_MIDI_MIN + Math.max(0, Math.min(1, norm)) * span);
  return midiToHz(midi);
}
function cutoffTunedHzToNorm(hz) {
  const midi = Math.max(
    CUTOFF_TUNED_MIDI_MIN,
    Math.min(CUTOFF_TUNED_MIDI_MAX, Math.round(hzToMidi(hz))),
  );
  return (midi - CUTOFF_TUNED_MIDI_MIN) / (CUTOFF_TUNED_MIDI_MAX - CUTOFF_TUNED_MIDI_MIN);
}
function cutoffTunedNoteName(hz) {
  const midi = Math.max(
    CUTOFF_TUNED_MIDI_MIN,
    Math.min(CUTOFF_TUNED_MIDI_MAX, Math.round(hzToMidi(hz))),
  );
  return noteName(midi);
}

// Pointer-drag lifecycle primitive — shared by both faceplates (0140).
//
// Both synths re-implemented the pointerdown → setPointerCapture → move →
// up/cancel choreography ≥4× with observable drift (VXN1 `wireDrag`, VXN2
// `fader.create` / `fader.createBipolar` / `knob.bindDrag`, plus the op-row
// KS-handle drags). This is the one owner.
//
// `wireDrag(el, geometry, callbacks)` owns the *mechanics*: hover vs drag
// state, pointer capture, the `dragging` class, optional rAF-throttling of
// moves, an optional hit-exclude predicate (so a press on a click-to-select
// child isn't a drag), and an optional inner target element. Two value
// models share the same `onMove(ev, payload)` seam:
//
//   • ABSOLUTE — pass `pointerToValue(ev, ctx)`; `payload` is its return
//     value, verbatim. VXN1's position-mapped faders / wave knob use this;
//     the contract is unchanged from the original `wireDrag`.
//   • RELATIVE — pass `axis: 'x' | 'y'` and no `pointerToValue`; `payload`
//     is `{ dx, dy, ctx }`, the signed pixel delta since the grab point,
//     already scaled by `shift` (default 0.1) while Shift is held. VXN2's
//     accumulate-from-grab faders / knob use this.
//
// Per-control side effects (gesture brackets, the `dataset.dragging`
// echo-gate) stay in the caller's `onDown` / `onUp` — they aren't universal.
//

// marker is stripped at splice time (see `strip_esm_exports`).

  el,
  {
    pointerToValue,        // (ev, ctx) => value — ABSOLUTE model; omit for RELATIVE

    target = el,           // element the listeners + pointer capture attach to (e.g. an inner <svg>)
    excludeHit = null,     // selector string | (ev) => bool — pointerdown on a match is ignored (click-to-select)
    axis = null,           // 'x' | 'y' — enables the RELATIVE delta payload (informational; both axes are reported)
    shift = 0.1,           // fine-drag multiplier applied to the whole delta-since-grab while Shift is held
    raf = false,           // throttle moves to one requestAnimationFrame; the trailing edit flushes on pointerup

  { onEnter, onDown, onMove, onUp, onLeave, onDoubleClick } = {},

  let dragging = false;
  let hovered = false;
  let ctx = null;
  let startX = 0;
  let startY = 0;
  let pendingEv = null; // latest move event awaiting an rAF flush

    if (!excludeHit) return false;
    if (typeof excludeHit === 'function') return excludeHit(ev);
    return ev.target instanceof Element && !!ev.target.closest(excludeHit);

  // RELATIVE payload: signed delta from the grab point, shift-scaled.

// Buffer ViewEvents that arrive before `init()` runs. The clack shell's
// CLAP timer (vxn-clap `on_timer`) starts pushing `param_changed` events
// as soon as `set_parent` registers it — that's often before the inline
// `init()` call below has populated the model.controls map and rebound the
// dispatcher. Without a buffer the first broadcast (which is the only
// one for params that aren't being automated) is dropped on the floor
// and `lastDisplay` on every fader stays empty until the user wiggles
// something.
const _earlyViewEvents = [];
// `_post` is the one place that constructs the wire object. Senders below
// are thin façades; a future debug-log or batching hook is a one-line
// change here.
function _post(msg) {
  try { window.ipc.postMessage(JSON.stringify(msg)); }
  catch (e) { console.warn('vxn.send failed', e); }
}
// Mutation hook (0141). The engine-mutating senders below (set_param /
// set_param_norm / reset_layer / set_key_mode / set_split_point) fire every
// registered callback after posting. `window.vxn.onMutation(cb)` is a
// first-class, additive hook in the dispatch layer, so a subscriber composes
// instead of overwriting (and can't silently drop a prior patcher's side
// effect). View-only / transport sends (gestures, preset load, text input,
// ready) deliberately don't fire it.
const _mutationHooks = [];
function _mutated() {
  for (const cb of _mutationHooks) {
    try { cb(); } catch (e) { console.warn('vxn.onMutation hook failed', e); }
  }
}

    // One-click discrete write. Brackets the set_param in a
    // begin/end gesture so the host records a single edit rather

    discrete(id, plain) {

// ─── Constants ─────────────────────────────────────────────────────────────

// Status-pill visibility window. Re-fired messages reset the timer so a
// rapid burst stays readable; the CSS fade transition handles the dismount.
const STATUS_PILL_FLASH_MS = 3000;

// ─── Floating text-input popup bridge (0048) ───────────────────────────────
//
// `window.vxn.promptText(title, initial, cb)` posts a `request_text_input`
// UiEvent and stashes `cb` in `_textInputCallbacks` keyed by a fresh id.
// Rust opens a native NSWindow (macOS) outside the host's NSEvent monitor
// scope, so Space and friends work as text input rather than transport.
// On commit / cancel the controller emits a `text_input_result` ViewEvent;
// the dispatcher looks up `id` and fires the matching callback exactly
// once. `value` is `null` on Esc / click outside, a string on Enter.
const _textInputCallbacks = new Map();
let _textInputCounter = 0;
window.vxn.promptText = function (title, initial, cb) {
  const id = 'ti' + (++_textInputCounter);
  _textInputCallbacks.set(id, cb);
  window.vxn.send.requestTextInput(id, title || '', initial || '');
};

// Register a callback fired on every engine-mutating send (0141). The preset
// bar uses it for dirty-tracking; see the `_mutated` chokepoint above.
window.vxn.onMutation = function (cb) {
  if (typeof cb === 'function') _mutationHooks.push(cb);
};

// `valuePop` (the floating value popup singleton) is spliced ahead of this
// module, so its top-level binding is already in scope for `attachValuePop`
// in panels.js.

// ─── Status pill (0046, repositioned in 0049) ──────────────────────────────
//
// Inline chip in the preset bar, right of the current preset name. The
// markup lives in faceplate.html so the bar layout is one HTML edit, not
// JS-built; this IIFE just binds and exposes a `.flash(text)` API.
// `Status { line }` ViewEvents flash for ~3s then fade (CSS transition).
// Re-fired messages reset the timer so a rapid burst stays readable.
const statusPill = (() => {
  const el = document.getElementById('pbar-status');
  let timer = null;
  return {
    flash(text) {
      if (!el) return;
      el.textContent = text;
      el.classList.add('visible');
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => el.classList.remove('visible'), STATUS_PILL_FLASH_MS);
    },
  };
})();

// Shared preset browser — floating two-pane folders/presets panel.
//
// Synth-agnostic: it speaks only the shared preset corpus shape (from
// `corpus_snapshot_json`) and the shared opcode vocabulary, and is wired to a
// host via an injected adapter, so VXN1 and VXN2 embed the same code with
// different bridges. Each synth's faceplate crate splices this file (ESM
// markers stripped) into its inline <script>, then a tiny per-synth glue
// calls `createPresetBrowser(cfg)` and registers the result where its bridge
// expects it.
//
// Features: two-pane FACTORY categories + USER folders / presets, flat
// case-insensitive search with origin labels, right-click context menu
// (Rename / Delete / Move-to ▸ on user presets; Rename / Delete on named
// folders), "+ New" folder, HTML5 drag-and-drop preset→folder, delete-confirm
// + Save-As (name + folder dropdown) modals, and follow-path after move/rename.
//
// cfg: {
//   send: { loadFactory(index), loadUser(path), renamePreset(path,newName),
//           deletePreset(path), movePreset(path,destFolder|null),
//           renameFolder(old,new), deleteFolder(name), newFolder(suggested),
//           savePreset(name, folder|null) },
//   promptText: (title, initial, cb) => void,   // cb(value|null)
//   faceplateRoot: () => Element,               // modal mount target
// }
//
// The DOM contract is fixed element ids (both synths use them):
//   #browser-panel #browser-backdrop #browser-folders #browser-presets
//   #browser-search-input #browser-search-clear #browser-close
// `bind(root)` resolves them within `root || document` and wires listeners.

const UNCATEGORISED = 'Uncategorised';

// Map a folder name to the <select> value used in Save As. The virtual root
// has no real name; sentinel it as `__root__`.
function folderValue(name) {
  return name == null ? '__root__' : name;
}

// Dropdown options for the Save As folder selector: virtual root first, then
// alpha-sorted named user folders.
function folderOptions(corpus) {
  const named = [];
  for (const g of (corpus && corpus.user) || []) {
    if (g.name == null) continue;
    named.push(g.name);
  }
  named.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  const out = [{ value: '__root__', label: UNCATEGORISED }];
  for (const n of named) out.push({ value: n, label: n });
  return out;
}

// Move-target list for a user preset's context submenu: Uncategorised first
// (if a root group exists and we're not already in root), then alpha-sorted
// named folders excluding the current one.
function moveTargets(currentName, corpus) {
  const out = [];
  let hasRoot = false;
  const named = [];
  for (const g of (corpus && corpus.user) || []) {
    if (g.name == null) { hasRoot = true; continue; }
    named.push(g.name);
  }
  named.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  if (hasRoot && currentName !== null) {
    out.push({ name: null, label: UNCATEGORISED });
  }
  for (const n of named) {
    if (n === currentName) continue;
    out.push({ name: n, label: n });
  }
  return out;
}

function createPresetBrowser(cfg) {
  const send = cfg.send;
  const promptText = cfg.promptText;
  const faceplateRoot = cfg.faceplateRoot || (() => document.body);

  let panelEl = null;
  let backdropEl = null;
  let foldersEl = null;
  let presetsEl = null;
  let inputEl = null;
  let clearEl = null;
  let closeEl = null;
  let bound = false;

  let corpus = { factory: [], user: [] };
  let selectedFolder = { kind: 'user', name: null };
  let query = '';
  let currentSource = null;
  let isOpen = false;
  let onOpenChange = null;

  let menuEl = null;
  let modalEl = null;

  // HTML5 DnD state. `dragSourcePath` is non-null while dragging a user
  // preset row; `dragSourceFolder` is the folder it came from. dataTransfer
  // can't be read during `dragover`, so in-page logic reads these.
  let dragSourcePath = null;
  let dragSourceFolder = null;

  const FACTORY_HEADER = 'FACTORY';
  const USER_HEADER = 'USER';

  function bind(root) {
    const scope = root || document;
    panelEl = scope.querySelector('#browser-panel');
    if (!panelEl) return;
    backdropEl = scope.querySelector('#browser-backdrop');
    foldersEl = scope.querySelector('#browser-folders');
    presetsEl = scope.querySelector('#browser-presets');
    inputEl = scope.querySelector('#browser-search-input');
    clearEl = scope.querySelector('#browser-search-clear');
    closeEl = scope.querySelector('#browser-close');
    bound = true;

    if (inputEl) {
      inputEl.addEventListener('input', () => {
        query = inputEl.value || '';
        renderPresets();
      });
    }
    if (clearEl) {
      clearEl.addEventListener('click', () => {
        if (inputEl) inputEl.value = '';
        query = '';
        renderPresets();
        if (inputEl) inputEl.focus();
      });
    }
    if (backdropEl) backdropEl.addEventListener('click', () => setOpen(false));
    if (closeEl) {
      closeEl.addEventListener('click', (e) => {
        e.stopPropagation();
        setOpen(false);
      });
    }
    // Click inside the panel that isn't the menu closes the menu.
    panelEl.addEventListener('click', (e) => {
      if (menuEl && !menuEl.contains(e.target)) closeMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!isOpen) return;
      e.preventDefault();
      // ESC closes one level: modal → menu → panel.
      if (modalEl) { closeModal(); return; }
      if (menuEl) { closeMenu(); return; }
      setOpen(false);
    });
    renderFolders();
    renderPresets();
  }

  function setCorpus(snap) {
    corpus = snap || { factory: [], user: [] };
    if (!Array.isArray(corpus.factory)) corpus.factory = [];
    if (!Array.isArray(corpus.user)) corpus.user = [];
    if (!folderExists(selectedFolder)) {
      selectedFolder = { kind: 'user', name: null };
    }
    // Any in-flight menu / modal is stale after a corpus change.
    closeMenu();
    closeModal();
    if (bound) {
      renderFolders();
      renderPresets();
    }
  }
  function folderExists(key) {
    if (!key) return false;
    const list = key.kind === 'factory' ? corpus.factory : corpus.user;
    if (!Array.isArray(list)) return false;
    for (const g of list) {
      const gn = key.kind === 'factory' ? g.category : g.name;
      if (gn === key.name || (gn == null && key.name == null)) return true;
    }
    return false;
  }
  function folderLabel(key, group) {
    if (key.kind === 'factory') return group.category || UNCATEGORISED;
    return group.name || UNCATEGORISED;
  }
  function renderFolders() {
    if (!foldersEl) return;
    foldersEl.innerHTML = '';
    appendSection(FACTORY_HEADER, null);
    for (const g of corpus.factory) {
      appendFolderRow({ kind: 'factory', name: g.category }, folderLabel({ kind: 'factory' }, g));
    }
    appendSection(USER_HEADER, () => {
      promptText('New folder', 'New Folder', (value) => {
        if (value == null) return;
        const trimmed = value.trim();
        if (!trimmed) return;
        send.newFolder(trimmed);
      });
    });
    for (const g of corpus.user) {
      appendFolderRow({ kind: 'user', name: g.name }, folderLabel({ kind: 'user' }, g));
    }
  }
  function appendSection(text, onNewFolder) {
    if (onNewFolder) {
      const row = document.createElement('div');
      row.className = 'browser-section-row';
      const h = document.createElement('div');
      h.className = 'browser-section';
      h.textContent = text;
      row.appendChild(h);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'browser-new-folder';
      btn.textContent = '+ New';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeMenu();
        onNewFolder();
      });
      row.appendChild(btn);
      foldersEl.appendChild(row);
    } else {
      const h = document.createElement('div');
      h.className = 'browser-section';
      h.textContent = text;
      foldersEl.appendChild(h);
    }
  }
  function appendFolderRow(key, label) {
    const r = document.createElement('div');
    r.className = 'browser-row';
    r.textContent = label;
    if (selectedFolder.kind === key.kind && selectedFolder.name === key.name) {
      r.classList.add('selected');
    }
    r.addEventListener('click', () => {
      selectedFolder = key;
      closeMenu();
      renderFolders();
      renderPresets();
    });
    // Only named user folders carry a context menu. The virtual root
    // represents the user dir itself.
    if (key.kind === 'user' && key.name != null) {
      r.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        openMenu(e, { kind: 'folder', name: key.name });
      });
    }
    // Every user folder (incl. root) is a drop target; factory folders are
    // not (default behaviour rejects the drop).
    if (key.kind === 'user') {
      r.addEventListener('dragover', (e) => {
        if (dragSourcePath == null) return;
        if (key.name === dragSourceFolder) {
          r.classList.add('drag-blocked');
          return;
        }
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        r.classList.add('drag-over');

  'Saw+':     [[0, 0.85], [0.5, 0.15], [0.5, 0.85], [1, 0.15]],
  'Saw-':     [[0, 0.15], [0.5, 0.85], [0.5, 0.15], [1, 0.85]],
  'Pulse':    [[0, 0.85], [0, 0.15], [0.5, 0.15], [0.5, 0.85], [1, 0.85]],
  'Square':   [[0, 0.85], [0, 0.15], [0.5, 0.15], [0.5, 0.85], [1, 0.85]],
  'S&H':      [[0, 0.6], [0.28, 0.6], [0.28, 0.2], [0.56, 0.2], [0.56, 0.8], [0.82, 0.8], [0.82, 0.45], [1, 0.45]],
};

function glyphPath(label, w, h) {
  const pts = WAVE_GLYPHS[label];
  if (!pts) return null;
  return pts.map((p, i) =>
    (i === 0 ? 'M' : 'L') + (p[0] * w).toFixed(2) + ' ' + (p[1] * h).toFixed(2)
  ).join(' ');
}

// ─── Control primitives ────────────────────────────────────────────────────

function makeFader(el, id, desc, opts) {
  const noLabel = el.hasAttribute('data-no-label');
  const label = el.dataset.label || desc.label;
  const displayOverride = (opts && opts.displayOverride) || null;
  // Optional hooks for faders whose mapping/display swap with a partner
  // toggle (LFO rate ↔ sync, Cutoff ↔ Tuned). `interactionOverride(n)`
  // returns `{plain, norm}` to swap the drag-write path (sends plain Hz
  // instead of raw norm); `normOverride(plain)` returns a thumb norm
  // computed from the param's plain value, bypassing the descriptor
  // taper. Both return null to fall through to the default behaviour.
  const interactionOverride = (opts && opts.interactionOverride) || null;
  const normOverride = (opts && opts.normOverride) || null;
  el.innerHTML = `
    ${noLabel ? '' : `<div class="ctl-label">${label.toUpperCase()}</div>`}
    <div class="ctl-fader">
      <div class="ctl-fader-track"></div>
      <div class="ctl-fader-thumb"></div>
    </div>
  `;
  const fader = el.querySelector('.ctl-fader');
  const thumb = el.querySelector('.ctl-fader-thumb');
  let lastDisplay = '';

  const writeFromDrag = (rawNorm) => {
    const o = interactionOverride && interactionOverride(rawNorm);
    if (o) {
      paintFader(fader, thumb, o.norm);
      window.vxn.send.setParam(id, o.plain);
    } else {
      paintFader(fader, thumb, rawNorm);
      window.vxn.send.setParamNorm(id, rawNorm);
    }
  };

  let drag;
  const pop = attachValuePop({
    isHovered:  () => drag.isHovered(),
    isDragging: () => drag.isDragging(),
  }, () => lastDisplay);
  drag = wireFaderDrag(fader, {
    onEnter: (ev) => pop.markEntered(ev),
    onLeave: () => pop.markLeft(),
    onDown: (ev, n) => {
      window.vxn.send.beginGesture(id);
      writeFromDrag(n);
      pop.markGrabbed(ev);                                // re-anchor at the grab point
    },
    onMove: (_ev, n) => writeFromDrag(n),
    onUp: () => {
      window.vxn.send.endGesture(id);
      pop.markReleased();
    },
  });

  return {
    update(plain, norm, display) {
      // ViewEvent echo — always position the thumb so DAW automation
      // moves it even mid-drag (engine value is authoritative). During a
      // drag the local pointermove `paintFader` and the round-trip echo
      // converge on the same value, so the thumb stays glued to the
      // cursor without flicker.
      const overriddenNorm = normOverride && normOverride(plain);
      paintFader(fader, thumb, overriddenNorm != null ? overriddenNorm : norm);
      // Synced LFO rates swap the Hz readout for a subdivision label
      // (0042). The override is null for every other fader, so this
      // collapses to the plain path.
      let label = display;
      if (displayOverride) {
        const o = displayOverride(plain, norm, display);
        if (o != null) label = o;
      }
      lastDisplay = label;
      pop.refresh();
    },
  };
}

// Map a normalised fader position (linear `[0, 1]`) to the matching
// subdivision label. The LFO rate fader's `norm` is the linear range
// position (`get_normalized`, not the exp-tapered fader-position); since
// `vxn_app::sync::index_from_norm` only ever takes the slider's `0..1`,
// either convention agrees on the index — the table is just spread evenly
// across the travel.
function subdivisionLabel(norm) {
  const t = window.vxn.subdivisions || [];
  if (t.length === 0) return '';
  const last = t.length - 1;
  const n = Math.max(0, Math.min(1, norm));
  return t[Math.max(0, Math.min(last, Math.round(n * last)))];
}

// ─── Rotary waveform knob ──────────────────────────────────────────────────
//
// Single SVG: knob face + rotating indicator + glyph labels spread around
// a 270° arc with the gap at the bottom (clamped knob, no wrap). Drag
// rotation = vertical pointer motion (up = CW, down = CCW), clamped at
// endpoints, snapped to the nearest detent. Click a glyph for direct
// selection.
//
// Variant angles are evenly distributed across ARC_START..ARC_END, so the
// 4-variant Osc knob still lands its glyphs at SW/NW/NE/SE (the corners
// of -135°…+135° "from up CW") while the 6-variant LFO shape fits without
// crowding the corners. Indicator angle is the same affine function of
// value, so the CSS transition always sweeps along the populated arc.
const SVG_NS = 'http://www.w3.org/2000/svg';

/// Wave-selector geometry, in the SVG's own 64×64 user units. Prefixed like the
/// dial's constants below because everything in this file lands in one flat
/// script scope once spliced.
const WAVE_SIZE = 64;
const WAVE_CX = WAVE_SIZE / 2;
const WAVE_CY = WAVE_SIZE / 2;
/// Knob face radius; the indicator line stops 2 units short of it.
const WAVE_KNOB_R = 13;
/// Radius the glyph labels sit on, and their box.
const WAVE_GLYPH_R = 26;
const WAVE_GLYPH_W = 14;
const WAVE_GLYPH_H = 10;
/// 270° arc with a 90° gap at the bottom. Angles measured in degrees CW from
/// "straight up" (0°), so -135° = SW corner, +135° = SE.
const WAVE_ARC_START = -135;
const WAVE_ARC_SWEEP = 270;

/// Where each variant sits on the arc: `degAt(i)` for variant `i`, evenly
/// spaced across the sweep. A single-variant control parks at the start rather
/// than dividing by zero.
function waveArc(count) {
  const step = count > 1 ? WAVE_ARC_SWEEP / (count - 1) : 0;
  return { degAt: (i) => WAVE_ARC_START + i * step };
}

/// The glyph labels along the arc, one `<g>` per variant, appended in order.
/// A transparent rect behind each path makes the whole label area clickable
/// rather than just the stroked pixels; the pointerdown stops propagation so
/// the knob's drag never sees a glyph pick.
function buildWaveGlyphs(svg, arc, variants, id) {
  return variants.map((name, i) => {
    const a = arc.degAt(i) * Math.PI / 180;
    const gx = WAVE_CX + WAVE_GLYPH_R * Math.sin(a);
    const gy = WAVE_CY - WAVE_GLYPH_R * Math.cos(a);
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('transform',
      `translate(${(gx - WAVE_GLYPH_W / 2).toFixed(2)} ${(gy - WAVE_GLYPH_H / 2).toFixed(2)})`);
    g.setAttribute('cursor', 'pointer');

    const hit = document.createElementNS(SVG_NS, 'rect');
    hit.setAttribute('x', -3); hit.setAttribute('y', -3);
    hit.setAttribute('width',  WAVE_GLYPH_W + 6);
    hit.setAttribute('height', WAVE_GLYPH_H + 6);
    hit.setAttribute('fill', 'transparent');
    g.appendChild(hit);

    const path = document.createElementNS(SVG_NS, 'path');
    const d = glyphPath(name, WAVE_GLYPH_W, WAVE_GLYPH_H);
    if (d) {
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-width', 1.4);
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
    }
    g.appendChild(path);

    g.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      window.vxn.send.discrete(id, i);
    });

    svg.appendChild(g);
    return { g, path, name };
  });
}

/// Knob face: rim + inner dimple, both purely visual and neither retained.
function buildWaveFace(svg) {
  const rim = document.createElementNS(SVG_NS, 'circle');
  rim.setAttribute('cx', WAVE_CX); rim.setAttribute('cy', WAVE_CY);
  rim.setAttribute('r', WAVE_KNOB_R);
  rim.setAttribute('fill', 'var(--knob-face)');
  rim.setAttribute('stroke', 'var(--knob-rim)');
  rim.setAttribute('stroke-width', 1);
  svg.appendChild(rim);

  const dimple = document.createElementNS(SVG_NS, 'circle');
  dimple.setAttribute('cx', WAVE_CX); dimple.setAttribute('cy', WAVE_CY);
  dimple.setAttribute('r', WAVE_KNOB_R * 0.62);
  dimple.setAttribute('fill', 'var(--knob-dimple)');
  dimple.setAttribute('stroke', 'var(--knob-dimple-rim)');
  dimple.setAttribute('stroke-width', 0.5);
  svg.appendChild(dimple);
}

/// Rotating indicator — a line from centre to rim, rotated by the `<g>` this
/// returns. CSS transition on the group smooths automation moves between
/// detents.
function buildWaveIndicator(svg) {
  const indicatorG = document.createElementNS(SVG_NS, 'g');
  indicatorG.setAttribute('transform-origin', `${WAVE_CX} ${WAVE_CY}`);
  indicatorG.style.transition = `transform ${KNOB_INDICATOR_TRANSITION_MS}ms ease-out`;
  const indicator = document.createElementNS(SVG_NS, 'line');
  indicator.setAttribute('x1', WAVE_CX); indicator.setAttribute('y1', WAVE_CY);
  indicator.setAttribute('x2', WAVE_CX); indicator.setAttribute('y2', WAVE_CY - WAVE_KNOB_R + 2);
  indicator.setAttribute('stroke', 'var(--knob-indicator)');
  indicator.setAttribute('stroke-width', 2);
  indicator.setAttribute('stroke-linecap', 'round');
  indicatorG.appendChild(indicator);
  svg.appendChild(indicatorG);
  return indicatorG;
}

function makeWave(el, id, desc) {
  const label = el.dataset.label || desc.label;
  const variants = desc.variants || [];
  el.innerHTML = `<div class="ctl-label">${label.toUpperCase()}</div>`;

  const arc = waveArc(variants.length);
  let value = 0;
  let lastDisplay = variants[0] || '';

  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', WAVE_SIZE);
  svg.setAttribute('height', WAVE_SIZE);
  svg.setAttribute('viewBox', `0 0 ${WAVE_SIZE} ${WAVE_SIZE}`);
  svg.classList.add('ctl-wave');
  el.appendChild(svg);

  // Append order is paint order: glyphs first, then the face over them, then
  // the indicator on top.
  const glyphEls = buildWaveGlyphs(svg, arc, variants, id);
  buildWaveFace(svg);
  const indicatorG = buildWaveIndicator(svg);

  // ── Hover + vertical-drag rotation (no wrap) ───────────────────────────
  // Glyph hits stopPropagation; the knob face falls through to wireDrag.
  // `downContext` stashes the pixel anchor + the value at grab-time so the
  // pointer-to-value map is delta-based, not absolute.
  // `pop` is forward-declared because the drag callbacks reference it but
  // `attachValuePop` needs the drag's hover/drag getters as its host.
  let pop;
  const drag = wireDrag(svg, {
    downContext: (ev) => ({ y0: ev.clientY, v0: value }),
    pointerToValue: (ev, ctx) =>
      clampVariant(ctx.v0 + (ctx.y0 - ev.clientY) / PIXELS_PER_DETENT, variants),
  }, {
    onEnter: (ev) => pop.markEntered(ev),
    onLeave: () => pop.markLeft(),
    onDown:  (ev) => {
      window.vxn.send.beginGesture(id);
      pop.markGrabbed(ev);
    },
    onMove:  (_ev, v) => {
      if (v !== value) window.vxn.send.setParam(id, v);
    },
    onUp:    () => {
      window.vxn.send.endGesture(id);
      pop.markReleased();
    },
  });
  pop = attachValuePop(drag, () => lastDisplay);

  function applyValue(v, display) {
    value = v;
    indicatorG.setAttribute('transform', `rotate(${arc.degAt(v).toFixed(2)})`);
    glyphEls.forEach((g, i) => {
      g.path.setAttribute('stroke',
        i === v ? 'var(--glyph-active)' : 'var(--glyph)');
    });
    lastDisplay = display;
    pop.refresh();
  }

  // Seed the initial pose so the indicator + active-glyph state are right
  // before the first ParamChanged echo lands.
  applyValue(0, variants[0] || '');

  return {
    update(plain, norm, display) {
      const v = clampVariant(plain, variants);
      applyValue(v, display);
    },
  };
}

// ─── Generic rotary dial (0208, Dynamics pane) ─────────────────────────────
//
// Small SVG knob for continuous params, ported from vxn-2's `panels/dial.js`
// into vxn1b's fader-family contract: a 270° arc track + fill + circular face
// + rotating indicator line. Used where panel space is tight — the Dynamics
// pane packs six of these in a 2-row grid instead of six vertical faders.
//
// Interaction is the same gesture / echo contract as `makeFader`, in a rotary
// shape: relative vertical drag on the shared `wireDrag` primitive (rAF-
// throttled, Shift = fine, 200 px full travel), gesture brackets, and the
// hover/drag value-pop. Up (a negative clientY delta) raises the value. No
// double-click numeric entry — vxn1b faders don't have it, so the dial keeps
// parity (drag + hover-pop only).
//
// Geometry mirrors vxn-2's dial: ARC_START = -135°, SWEEP = 270°, a 36 px
// square with the arc outside the dial body so the indicator overprints
// cleanly. `describeArc` walks the SVG arc; `normToDeg` is the same affine
// map so the fill + indicator always agree.
const DIAL_ARC_START = -135;
const DIAL_ARC_SWEEP = 270;
/// Pointer travel for a dial's full 0..1 span. NOT "matches the fader", as the
/// comment here used to claim: the vertical faders are absolute-mapped over
/// their own height by `wireFaderDrag`, so they have no px-per-span figure to
/// match. 200 px is simply the dial's own calibration.
const DIAL_RANGE_PX = 200;

/// The bipolar depth fader's travel, declared beside the dial's rather than
/// inside `makeBipolar`. A wide 400 px full-scale span (2× vxn-2's) makes
/// gentle depths easy to dial without Shift; Shift still gives 0.1× fine, and
/// double-click resets to 0 (0219 §3 calibration).
const BIPOLAR_RANGE_PX = 400;
const DIAL_SIZE = 36;
const DIAL_CX = DIAL_SIZE / 2;
const DIAL_CY = DIAL_SIZE / 2;
const DIAL_R = 12;
const DIAL_ARC_R = 15;

function dialNormToDeg(norm) {
  return DIAL_ARC_START + norm * DIAL_ARC_SWEEP;
}

function dialDescribeArc(cx, cy, r, startDeg, endDeg) {
  const s = (startDeg - 90) * Math.PI / 180;
  const e = (endDeg - 90) * Math.PI / 180;
  const sx = cx + r * Math.cos(s);
  const sy = cy + r * Math.sin(s);
  const ex = cx + r * Math.cos(e);
  const ey = cy + r * Math.sin(e);
  const large = (endDeg - startDeg) <= 180 ? 0 : 1;
  return 'M ' + sx.toFixed(2) + ' ' + sy.toFixed(2)
       + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 '
       + ex.toFixed(2) + ' ' + ey.toFixed(2);
}

function makeDial(el, id, desc, opts) {
  const noLabel = el.hasAttribute('data-no-label');
  const label = el.dataset.label || desc.label;
  // Same hook as `makeFader`: a dial whose readout is not the raw number
  // (layer pan reads L/C/R, 0248). Null for every other dial, so the plain
  // path is unchanged.
  const displayOverride = (opts && opts.displayOverride) || null;
  // Where the lit arc GROWS FROM. A unipolar param grows from the most
  // anticlockwise point (norm 0 = the bottom of the range); a bipolar one is
  // detented at its centre, so it grows from 12 o'clock in whichever direction
  // the knob was turned — the same read as the bipolar faders' centre-origin
  // fill. Keyed off the descriptor rather than a per-cell flag: a range that
  // straddles zero IS the definition of centre-origin here, and it makes the
  // mixer's pan and detune dials (0248) correct without either cell opting in.
  // `min < 0 && max > 0` deliberately excludes ranges that merely END at zero
  // (dynamics threshold, −60…0 dB), which are unipolar with a negative unit.
  const fillOrigin = (desc.min < 0 && desc.max > 0) ? 0.5 : 0;
  const trackArc = dialDescribeArc(
    DIAL_CX, DIAL_CY, DIAL_ARC_R, DIAL_ARC_START, DIAL_ARC_START + DIAL_ARC_SWEEP);
  el.innerHTML =
    (noLabel ? '' : `<div class="ctl-label">${label.toUpperCase()}</div>`) +
    `<svg class="ctl-dial" width="${DIAL_SIZE}" height="${DIAL_SIZE}" viewBox="0 0 ${DIAL_SIZE} ${DIAL_SIZE}">` +
      `<path class="dial-track" d="${trackArc}" />` +
      `<path class="dial-fill" d="${trackArc}" />` +
      `<circle class="dial-face" cx="${DIAL_CX}" cy="${DIAL_CY}" r="${DIAL_R}" />` +
      `<g class="dial-indicator-g" transform="rotate(0 ${DIAL_CX} ${DIAL_CY})">` +
        `<line class="dial-indicator-line" x1="${DIAL_CX}" y1="${DIAL_CY}" x2="${DIAL_CX}" y2="${DIAL_CY - DIAL_R + 1}" />` +
      `</g>` +
    `</svg>`;

  const svg = el.querySelector('.ctl-dial');
  const fillPath = el.querySelector('.dial-fill');
  const indicatorG = el.querySelector('.dial-indicator-g');
  let currentNorm = 0;
  let lastDisplay = '';

  function paint(norm) {
    currentNorm = norm;
    indicatorG.setAttribute(
      'transform',
      `rotate(${dialNormToDeg(norm).toFixed(2)} ${DIAL_CX} ${DIAL_CY})`);
    // Re-draw the fill arc between `fillOrigin` and `norm` — the span runs
    // whichever way round the two sit, so a bipolar dial fills anticlockwise
    // below centre and clockwise above it. Cap the span at a hair above zero
    // so a norm sitting exactly on the origin still renders a usable
    // zero-length stub (no NaN path).
    const from = Math.min(fillOrigin, norm);
    const to = Math.max(fillOrigin, norm);
    const startDeg = DIAL_ARC_START + from * DIAL_ARC_SWEEP;
    const sweep = Math.max(0.001, to - from) * DIAL_ARC_SWEEP;
    fillPath.setAttribute(
      'd', dialDescribeArc(DIAL_CX, DIAL_CY, DIAL_ARC_R, startDeg, startDeg + sweep));
  }

  // Vertical relative drag: up raises.
  const pop = wireNormDrag(svg, id, {
    axis: 'y',
    rangePx: DIAL_RANGE_PX,
    paint,
    getNorm: () => currentNorm,
    getLabel: () => lastDisplay,
  });

  // Seed at norm 0; the bind-time echo repaints authoritatively (matches
  // makeFader, which also relies on dispatch pushing an echo on bind).
  paint(0);

  return {
    update(plain, norm, display) {
      // ViewEvent echo — always paint from the authoritative engine norm so
      // DAW automation moves the dial even mid-drag (during a local drag the
      // pointermove paint and the round-trip echo converge on the same value).
      paint(norm);
      let text = display;
      if (displayOverride) {
        const o = displayOverride(plain, norm, display);
        if (o != null) text = o;
      }
      lastDisplay = text;
      pop.refresh();
    },
  };
}

// ─── Bipolar horizontal fader (mod-matrix depth, 0219) ──────────────────────
//
// Ported from vxn-2's `createBipolar` (panels/fader.js): a center-origin
// horizontal fader for a bipolar `[-1, 1]` param — the fill grows *signed* from
// the 50% centre so "same source, opposite depths" reads at a glance (one slot
// +0.5, another −0.5). Follows `makeDial`'s dispatch contract (setParamNorm +
// gesture brackets + an `update` echo), so it automates and rebinds per layer
// like any other cell. The centre of the param's normalised range is 0 depth.
function makeBipolar(el, id, desc) {
  const noLabel = el.hasAttribute('data-no-label') || el.dataset.label === '';
  const label = el.dataset.label || desc.label;
  el.innerHTML =
    (noLabel ? '' : `<div class="ctl-label">${label.toUpperCase()}</div>`) +
    `<div class="fader-track">` +
      `<div class="vxn-mm-depth-center"></div>` +
      `<div class="fader-track-fill"></div>` +
      `<div class="fader-thumb"></div>` +
    `</div>`;

  const track = el.querySelector('.fader-track');
  const fill = el.querySelector('.fader-track-fill');
  const thumb = el.querySelector('.fader-thumb');
  let currentNorm = 0.5;
  let lastDisplay = '';

  // Signed fill grown horizontally from the 50% centre toward the thumb.
  function paint(norm) {
    currentNorm = norm;
    const pct = norm * 100;
    if (norm >= 0.5) {
      fill.style.left = '50%';
      fill.style.width = `${pct - 50}%`;
    } else {
      fill.style.left = `${pct}%`;
      fill.style.width = `${50 - pct}%`;
    }
    thumb.style.left = `${pct}%`;
  }

  // Horizontal relative drag: right raises.
  const pop = wireNormDrag(track, id, {
    axis: 'x',
    rangePx: BIPOLAR_RANGE_PX,
    paint,
    getNorm: () => currentNorm,
    getLabel: () => lastDisplay,
  });

  // Seed at centre (0 depth); the bind-time echo repaints authoritatively.
  paint(0.5);

  return {
    update(plain, norm, display) {
      // Always paint from the authoritative engine norm so DAW automation moves
      // the fader even mid-drag (the local paint and the echo converge).
      paint(norm);
      lastDisplay = display;
      pop.refresh();
    },
  };
}

;
// panels/discrete.js — the click-to-pick widgets: Switch, ButtonGroup, Dropdown
// and HeaderSwitch. (The three-tab strip is not here — it is `wireTabs` in
// `dispatch.js`.)
//
// All four pickers share the same write semantics: a click sends
// `begin_gesture` → `set_param` → `end_gesture` (via `send.discrete`) so the
// host records a single discrete edit. No drag, no popup.
//
// `import` lines are dropped by the splice loader (the sibling helpers ride the
// same concatenated scope); under Node ESM they resolve so the suites can pull
// these via the `../panels.js` barrel.


// `Switch(id, label)` — vertical toggle for bools; also handles 2-variant
// enums (NoiseColor, FilterSlope, LfoSync, …) the way vizia's
// `Ctl::Switch` does, by rendering one toggle per variant in a row.
function makeSwitch(el, id, desc) {
  const label = el.dataset.label || desc.label;
  const isEnum = desc.kind === 'enum';
  const entries = isEnum
    ? (desc.variants || []).map((name, i) => ({ idx: i, name }))
    : [{ idx: 1, name: label }];
  el.innerHTML = '';
  el.style.display = 'inline-flex';
  el.style.flexDirection = 'row';
  el.style.gap = '12px';
  el.style.alignItems = 'center';

  const rows = entries.map(({ idx, name }) => {
    const row = tgRow(name);
    row.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      let plain;
      if (isEnum) {
        plain = idx;
      } else {
        // Bool: toggle current. `row.classList.contains('active')` is the
        // local truth; the round-trip echo will reconcile if the engine
        // refuses (clamped, gated).
        plain = row.classList.contains('active') ? 0 : 1;
      }
      window.vxn.send.discrete(id, plain);
    });
    el.appendChild(row);
    return { row, idx };
  });

  return {
    update(plain) {
      const p = isEnum
        ? clampVariant(plain, entries)
        : (plain >= 0.5 ? 1 : 0);
      rows.forEach(({ row, idx }) => row.classList.toggle('active', idx === p));
    },
  };
}

// `ButtonGroup(id, label, variants)` — for Oversample, Cross Mod type and
// Voice's stack width. Vertical stack of labelled toggles under a column label
// (matches vizia's `enum_list_body`).
//
// `data-no-label` — render no column header, for a group whose surrounding
// layout already labels it. Supported here; no ButtonGroup in the current
// faceplate sets it (the faders do, in the mixer strips).
// `data-order` — comma-separated display permutation of the variant indices

// "change" event on commit, and a body-attached fixed popup (so the overlay's
// overflow can't clip it). `vocab` entries are `{ value, label }`.

// lifecycle is four methods that all read the same three fields (`_vocab`,
// `_value`, `_popup`), and the two document-level capture listeners need

// forwards here.

    btn.className = 'vxn-mm-combo';

    caret.textContent = '▾';

      get: () => this._value,

    // references `open()` registered — both are capture-phase.
