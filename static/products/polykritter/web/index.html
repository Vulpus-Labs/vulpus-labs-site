<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolyKritter: web demo</title>
  <!-- Link previews (Open Graph, X): the faceplate. Crawlers want absolute
       URLs, so these name the published page, where `cargo xtask deploy-web` puts it.
       The page itself is built by silkscreen-page.mjs (0326). -->
  <meta name="description" content="Play PolyKritter, the virtual analog poly synth from Vulpus Labs, in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vulpus Labs">
  <meta property="og:title" content="PolyKritter: web demo">
  <meta property="og:description" content="Play PolyKritter, the virtual analog poly synth from Vulpus Labs, in your browser.">
  <meta property="og:url" content="https://vulpuslabs.com/products/polykritter/web/">
  <meta property="og:image" content="https://vulpuslabs.com/products/polykritter/web/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="638">
  <meta property="og:image:alt" content="The PolyKritter faceplate">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://vulpuslabs.com/products/polykritter/web/og-image.png">
</head>
<body>
  <script type="module">
    import * as wasm from "./pkg/kritter_web.js";
    import { mountSynthPage } from "./silkscreen-page.mjs";

    mountSynthPage({
      wasm,
      name: "PolyKritter",
      blurb: "the virtual analog poly synth",
      engine: "./kritter_web_engine.wasm",
      example: "kritter",
      homepage: "https://vulpuslabs.com/products/polykritter",
      accent: "#ff6d78",
      logo: { src: "logo.png", alt: "PolyKritter, virtual analog poly synth", width: 432 },
      octaves: 4,
    });
  </script>
</body>
</html>
